<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDVOCATE - The Decision Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Brand Palette */
            --paper-bg: #FDFBF7; /* Slightly warmer white for premium feel */
            --ink-primary: #0F172A; /* Slate 900 - Sharper */
            --ink-secondary: #475569; /* Slate 600 */
            --brand-accent: #F97316; /* Vibrant Orange */
            --brand-accent-light: #FFF7ED; /* Orange 50 */
        }

        body { 
            font-family: 'Inter', sans-serif; /* Default to clean sans */
            background-color: var(--paper-bg); 
            color: var(--ink-primary); 
            margin: 0;
            overflow: hidden;
        }

        h1, h2, h3, h4, .serif-font {
            font-family: 'Averia Serif Libre', serif;
        }

        /* Texture & Background */
        .paper-texture {
            position: fixed;
            inset: 0;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* Floating Orbs for Premium Depth */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: float 20s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, 20px); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 3D Tilt Card Base */
        .tilt-card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                inset 0 0 20px rgba(255,255,255,0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out; /* Smooth follow */
        }

        /* Animations */
        .reveal-text {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); /* Apple-like ease */
        }
        .reveal-visible .reveal-text {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reveal-visible .delay-100 { transition-delay: 100ms; }
        .reveal-visible .delay-200 { transition-delay: 200ms; }
        .reveal-visible .delay-300 { transition-delay: 300ms; }
        .reveal-visible .delay-500 { transition-delay: 500ms; }

        /* SVG Line Drawing Animation */
        .reveal-visible .draw-stroke {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease-out forwards 0.5s;
        }
        
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        .logo-img { height: 80px; width: auto; object-fit: contain; }
        
        /* Illustration Styles */
        .illustration-stroke { stroke: var(--ink-primary); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
        .illustration-fill { fill: var(--ink-primary); }
        .illustration-accent { stroke: var(--brand-accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
        .illustration-accent-fill { fill: var(--brand-accent); }
        .illustration-wash { fill: var(--brand-accent-light); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const LOGO_URL = "https://raw.githubusercontent.com/imsivagabu/EDvocate-Logo/f41285224d83b110daddff1a18fbabf97dcbf6af/Logo%20Design.png";

        // --- Tilt Card Component ---
        const TiltCard = ({ children, className }) => {
            const cardRef = useRef(null);
            const [transform, setTransform] = useState('');

            const handleMouseMove = (e) => {
                if (!cardRef.current) return;
                const { left, top, width, height } = cardRef.current.getBoundingClientRect();
                const x = (e.clientX - left) / width;
                const y = (e.clientY - top) / height;
                
                const rotateX = (0.5 - y) * 10; // Max rotation deg
                const rotateY = (x - 0.5) * 10;

                setTransform(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
            };

            const handleMouseLeave = () => {
                setTransform('perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)');
            };

            return (
                <div 
                    ref={cardRef}
                    className={`tilt-card ${className}`} 
                    onMouseMove={handleMouseMove} 
                    onMouseLeave={handleMouseLeave}
                    style={{ transform: transform }}
                >
                    {children}
                </div>
            );
        };

        // --- Hero Background Component ---
        const HeroBackground = () => (
            <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                 {/* Rotating Engine Schematic */}
                 <svg className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[120vh] h-[120vh] opacity-10 animate-[spin_120s_linear_infinite]" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" stroke="#0F172A" strokeWidth="0.5" fill="none" strokeDasharray="4 4" />
                    <circle cx="100" cy="100" r="70" stroke="#F97316" strokeWidth="0.3" fill="none" />
                    <circle cx="100" cy="100" r="50" stroke="#0F172A" strokeWidth="0.5" fill="none" strokeDasharray="2 2" />
                    
                    {/* Crosshairs */}
                    <line x1="100" y1="10" x2="100" y2="190" stroke="#F97316" strokeWidth="0.2" />
                    <line x1="10" y1="100" x2="190" y2="100" stroke="#F97316" strokeWidth="0.2" />
                    
                    {/* Decorative arcs */}
                    <path d="M 100 20 A 80 80 0 0 1 180 100" stroke="#0F172A" strokeWidth="0.5" fill="none" strokeDasharray="2 4" />
                    <path d="M 100 180 A 80 80 0 0 1 20 100" stroke="#0F172A" strokeWidth="0.5" fill="none" strokeDasharray="2 4" />
                </svg>
                
                {/* Gradient Glow */}
                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-orange-100 rounded-full blur-[120px] opacity-30"></div>
            </div>
        );

        // --- Custom SVG Illustrations ---
        
        const IllusTimeline = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <line x1="20" y1="75" x2="180" y2="75" className="illustration-stroke" opacity="0.2"/>
                <circle cx="40" cy="75" r="4" className="illustration-fill" opacity="0.2"/>
                <text x="40" y="95" textAnchor="middle" fontSize="10" fill="#94a3b8" className="font-sans">Age 5</text>
                <g className="draw-stroke">
                    <circle cx="100" cy="75" r="6" className="illustration-accent-fill" />
                    <path d="M100 60 L100 40" className="illustration-accent" />
                </g>
                <rect x="70" y="15" width="60" height="25" rx="4" className="illustration-accent-fill" opacity="0.1" />
                <text x="100" y="32" textAnchor="middle" fontSize="11" fontWeight="bold" fill="#F97316" className="font-sans tracking-wider">DECISION</text>
                <text x="100" y="95" textAnchor="middle" fontSize="11" fontWeight="600" fill="#0F172A" className="font-sans">Age 15</text>
                <line x1="110" y1="75" x2="180" y2="75" className="illustration-stroke" strokeDasharray="4 4" />
                <text x="160" y="95" textAnchor="middle" fontSize="10" fill="#94a3b8" className="font-sans">Future?</text>
            </svg>
        );

        const IllusEmptyChair = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <line x1="20" y1="130" x2="180" y2="130" className="illustration-stroke" />
                <path d="M90 130 L90 80 L70 80 L70 130" className="illustration-stroke draw-stroke" />
                <path d="M70 80 L110 80 L110 130" className="illustration-stroke draw-stroke" />
                <text x="90" y="70" textAnchor="middle" fontSize="40" fontWeight="bold" fill="#F97316" className="serif-font animate-bounce">?</text>
                <text x="90" y="145" textAnchor="middle" fontSize="11" fill="#0F172A" className="font-sans">No Counselor</text>
            </svg>
        );

        const IllusImbalance = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <g opacity="0.2" fill="#0F172A">
                    {Array.from({length: 48}).map((_, i) => (
                        <circle key={i} cx={20 + (i%8)*22} cy={20 + Math.floor(i/8)*18} r="1.5" />
                    ))}
                </g>
                <circle cx="100" cy="120" r="8" className="illustration-accent-fill shadow-lg" />
                <path d="M100 120 L100 80" className="illustration-accent draw-stroke" strokeDasharray="4 4"/>
                <text x="120" y="125" fontSize="11" fill="#F97316" fontWeight="bold" className="font-sans">1 Counselor</text>
            </svg>
        );

        const IllusWeight = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <path d="M100 130 L80 130 L90 110 Z" className="illustration-fill" />
                <line x1="20" y1="110" x2="180" y2="50" className="illustration-stroke draw-stroke" />
                <circle cx="180" cy="40" r="8" className="illustration-stroke" strokeDasharray="2 2" />
                <text x="180" y="28" textAnchor="middle" fontSize="9" fill="#94a3b8" className="font-sans">Support</text>
                <rect x="10" y="90" width="40" height="40" className="illustration-accent-fill" />
                <text x="30" y="115" textAnchor="middle" fontSize="20" fill="white" fontWeight="bold">!</text>
                <text x="30" y="145" textAnchor="middle" fontSize="11" fill="#0F172A" fontWeight="bold" className="font-sans">Pressure</text>
            </svg>
        );

        const IllusDiverge = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <path d="M20 75 L80 75" className="illustration-stroke" />
                <path d="M80 75 Q120 75 160 30" className="illustration-stroke draw-stroke" stroke="#F97316" strokeWidth="2.5" />
                <path d="M150 30 L160 30 L160 40" className="illustration-accent" fill="none" />
                <path d="M80 75 Q120 75 160 120" className="illustration-stroke" opacity="0.1" strokeDasharray="4 4" />
                <text x="170" y="25" fontSize="11" fill="#F97316" fontWeight="bold" className="font-sans">Wrong Way</text>
            </svg>
        );

        const IllusMoneyDrain = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <path d="M60 40 L140 40 L140 100 L60 100 Z" className="illustration-wash" />
                <path d="M60 40 L140 40" className="illustration-stroke" />
                <text x="100" y="70" textAnchor="middle" fontSize="14" fill="#0F172A" fontWeight="bold" className="serif-font">DEGREE</text>
                <g className="draw-stroke">
                    <circle cx="80" cy="115" r="4" fill="#F97316" />
                    <circle cx="100" cy="130" r="4" fill="#F97316" />
                    <circle cx="120" cy="120" r="4" fill="#F97316" />
                    <path d="M100 100 L100 110" className="illustration-stroke" />
                </g>
            </svg>
        );

        const IllusCoaching = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <rect x="40" y="40" width="60" height="90" className="illustration-wash draw-stroke" stroke="#F97316" strokeWidth="2" />
                <text x="70" y="30" textAnchor="middle" fontSize="11" fill="#F97316" className="font-sans font-bold">Coaching</text>
                <rect x="120" y="110" width="40" height="20" className="illustration-stroke" />
                <text x="140" y="100" textAnchor="middle" fontSize="11" fill="#0F172A" className="font-sans">Guidance</text>
            </svg>
        );

        const IllusEngine = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <rect x="40" y="40" width="120" height="80" rx="8" className="illustration-fill draw-stroke" fill="none" stroke="#0F172A" strokeWidth="2" />
                <circle cx="80" cy="80" r="15" className="illustration-accent" fill="none" />
                <circle cx="120" cy="80" r="10" className="illustration-stroke" fill="none" />
                <text x="100" y="145" textAnchor="middle" fontSize="11" fill="#0F172A" fontWeight="bold" className="font-sans tracking-widest">DECISION ENGINE</text>
            </svg>
        );

        const IllusFunnel = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <path d="M40 30 L160 30 L110 90 L110 130 L90 130 L90 90 Z" className="illustration-wash draw-stroke" stroke="#0F172A" strokeWidth="1.5" />
                <circle cx="60" cy="20" r="3" fill="#F97316" />
                <circle cx="100" cy="15" r="3" fill="#0F172A" />
                <circle cx="140" cy="20" r="3" fill="#F97316" />
                <path d="M100 130 L100 145" className="illustration-accent draw-stroke" markerEnd="url(#arrow)" />
            </svg>
        );

        // New Illustration: Profile/Discovery
        const IllusProfile = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                 <defs>
                    <clipPath id="circleClip">
                        <circle cx="100" cy="75" r="30" />
                    </clipPath>
                </defs>
                <circle cx="100" cy="75" r="30" className="illustration-stroke" fill="#f8fafc" />
                {/* Data Points on Head */}
                <circle cx="100" cy="60" r="2" fill="#F97316" />
                <circle cx="90" cy="70" r="2" fill="#0F172A" />
                <circle cx="110" cy="75" r="2" fill="#F97316" />
                
                {/* Connecting lines */}
                <path d="M20 75 L70 75" className="illustration-stroke draw-stroke" strokeDasharray="4 4" />
                <path d="M130 75 L180 75" className="illustration-stroke draw-stroke" strokeDasharray="4 4" />
                
                <text x="45" y="65" fontSize="10" textAnchor="middle" fill="#64748B">Aptitude</text>
                <text x="155" y="65" fontSize="10" textAnchor="middle" fill="#64748B">Interest</text>
            </svg>
        );

        // New Illustration: Roadmap
        const IllusRoadmap = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <path d="M30 120 C 60 120, 60 80, 100 80 C 140 80, 140 40, 170 40" className="illustration-stroke draw-stroke" fill="none" strokeWidth="2" />
                <circle cx="30" cy="120" r="4" fill="#0F172A" />
                <circle cx="100" cy="80" r="4" fill="#F97316" />
                <circle cx="170" cy="40" r="4" fill="#0F172A" />
                <text x="100" y="100" textAnchor="middle" fontSize="10" fill="#64748B">5 Year Plan</text>
            </svg>
        );

        // --- Data ---
        const slides = [
            {
                type: "hero",
                title: "India’s Career Decision Crisis",
                subtitle: "EDVOCATE is a Decision Engine",
                tagline: "No mixing. No dilution."
            },
            
            // --- PART 1: THE WHY ---
            {
                type: "section",
                part: "PART 1",
                title: "THE WHY",
                subtitle: "The Crisis of Context"
            },
            {
                id: 1,
                title: "The Core Problem",
                body: "India forces irreversible career decisions too early, without structured decision support.",
                stat: "15–16 Years Old",
                statText: "Students in India make their first irreversible career decision at age 15–16 (Class 10), earlier than most OECD countries.",
                source: "Ministry of Education / AISHE structural analysis",
                illustration: IllusTimeline
            },
            {
                id: 2,
                title: "The Infrastructure Gap",
                body: "Career guidance is not institutionalized in India. Most students never meet a counselor.",
                stat: "75%",
                statText: "Over 75% of Indian schools do not have a dedicated career guidance professional.",
                source: "Education NGO audits & CBSE-affiliated school surveys",
                illustration: IllusEmptyChair
            },
             {
                id: 3,
                title: "The Decision Load",
                body: "High-impact decisions are made with near-zero professional input.",
                stat: "10–15 Years",
                statText: "A single career decision in India typically determines 10–15 years of education + employment trajectory.",
                source: "Labour market & education pathway studies",
                illustration: IllusWeight
            },
            {
                id: 4,
                title: "The Consequence",
                body: "Wrong decisions are widespread, leading to massive dissatisfaction.",
                stat: "45%+",
                statText: "Indian students report they chose the wrong stream after Class 12.",
                source: "National student surveys & career platform studies",
                illustration: IllusDiverge
            },
            {
                id: 5,
                title: "The Cost",
                body: "Wrong decisions have real financial consequences for families.",
                stat: "₹2–6 Lakh",
                statText: "Average middle-class Indian family spends ₹2–6 lakh on a degree before discovering mismatch.",
                source: "AISHE fee & household education expenditure data",
                illustration: IllusMoneyDrain
            },

            // --- PART 2: THE WHAT ---
            {
                type: "section",
                part: "PART 2",
                title: "THE WHAT",
                subtitle: "The Strategic Intervention"
            },
            {
                id: 6,
                title: "Coaching ≠ Guidance",
                body: "Preparation is mistaken for decision-making. We fix the decision.",
                stat: "80%",
                statText: "Over 80% of paid education spend in Classes 9–12 goes to exam coaching, not career guidance.",
                source: "Indian test-prep market analysis",
                illustration: IllusCoaching
            },
            {
                id: 7,
                title: "The Definition",
                body: "EDVOCATE is NOT just counselling. It is a decision engine.",
                stat: "2–3×",
                statText: "Structured decision frameworks improve decision quality by 2–3× versus intuition-based choices.",
                source: "Decision science & behavioral economics research",
                illustration: IllusEngine
            },

            // --- PART 3: THE HOW ---
            {
                type: "section",
                part: "PART 3",
                title: "THE HOW",
                subtitle: "Engineering the Future"
            },
            {
                id: 8,
                title: "Step 1: Deep Discovery",
                body: "We move beyond marks. We profile aptitude, personality, and interests to create a holistic dataset.",
                stat: "360°",
                statText: "Profiling across 5 dimensions: Aptitude, Interest, Personality, Orientation, and Emotional Intelligence.",
                source: "EDVOCATE Proprietary Framework",
                illustration: IllusProfile
            },
            {
                id: 9,
                title: "Step 2: Intelligent Mapping",
                body: "Our engine maps the student's unique profile against real-world market pathways.",
                stat: "500+",
                statText: "Career pathways analyzed and matched against the student's unique profile vector.",
                source: "EDVOCATE Algorithm",
                illustration: IllusFunnel
            },
             {
                id: 10,
                title: "Step 3: Strategic Roadmap",
                body: "We don't just give a recommendation. We build a multi-year execution plan.",
                stat: "5 Years",
                statText: "We generate a 5-year outlook covering Education, Skills, and Experience milestones.",
                source: "Longitudinal Success Planning",
                illustration: IllusRoadmap
            },
            {
                type: "close",
                quote: "“Great Talent.\nBroken Decisions.”",
                brand: "EDVOCATE builds the engine."
            }
        ];

        // --- Intersection Observer Hook ---
        const useIntersectionObserver = () => {
            const containerRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    setIsVisible(entry.isIntersecting);
                }, { threshold: 0.35 });

                if (containerRef.current) observer.observe(containerRef.current);
                return () => { if (containerRef.current) observer.unobserve(containerRef.current); };
            }, []);

            return [containerRef, isVisible];
        };

        const SlideRenderer = ({ slide, index, total }) => {
            const [ref, isVisible] = useIntersectionObserver();
            const Illustration = slide.illustration;
            
            // Layout for Hero
            if (slide.type === 'hero') {
                return (
                    <section ref={ref} className="h-screen w-full snap-start flex flex-col items-center justify-center p-8 relative overflow-hidden">
                        <HeroBackground />
                        
                        <div className={`relative z-10 text-center space-y-10 max-w-6xl transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                             <div className="reveal-text delay-100">
                                <div className="inline-block px-5 py-2 rounded-full border border-orange-200 bg-white/50 backdrop-blur-sm mb-4 shadow-sm">
                                    <span className="text-xs font-bold tracking-[0.3em] uppercase text-[#F97316] flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-[#F97316] animate-pulse"></span>
                                        Confidential
                                    </span>
                                </div>
                            </div>

                            <div className="reveal-text delay-200">
                                <h1 className="text-6xl md:text-8xl lg:text-9xl font-bold text-[#F97316] leading-[0.95] serif-font tracking-tight">
                                    {slide.title}
                                </h1>
                            </div>
                            
                            <div className="reveal-text delay-300">
                                <div className="flex flex-col items-center gap-6">
                                    <div className="h-20 w-px bg-gradient-to-b from-orange-400 to-transparent"></div>
                                    <p className="text-2xl md:text-4xl text-[#475569] font-light italic">
                                        {slide.subtitle}
                                    </p>
                                    <p className="text-sm font-bold tracking-[0.2em] uppercase text-slate-400 mt-4 border-t border-slate-200 pt-6 px-12">
                                        {slide.tagline}
                                    </p>
                                </div>
                            </div>
                        </div>

                         <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce text-[#F97316] opacity-70 z-20">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9" /></svg>
                        </div>
                    </section>
                );
            }

            // Layout for Section Breaks
            if (slide.type === 'section') {
                return (
                    <section ref={ref} className="h-screen w-full snap-start flex flex-col items-center justify-center p-8 bg-[#F97316] text-white relative overflow-hidden">
                         <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                         <div className={`text-center space-y-6 max-w-5xl relative z-10 transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                            <div className="reveal-text delay-100">
                                <span className="text-sm md:text-base font-bold tracking-[0.3em] uppercase opacity-80 border border-white/30 px-4 py-2 rounded-full">
                                    {slide.part}
                                </span>
                            </div>
                            <div className="reveal-text delay-200">
                                <h2 className="text-6xl md:text-9xl font-bold leading-none serif-font">
                                    {slide.title}
                                </h2>
                            </div>
                            <div className="reveal-text delay-300">
                                <p className="text-2xl md:text-3xl font-sans font-light opacity-90">
                                    {slide.subtitle}
                                </p>
                            </div>
                        </div>
                    </section>
                );
            }

            // Layout for Close
            if (slide.type === 'close') {
                return (
                    <section ref={ref} className="h-screen w-full snap-start flex flex-col items-center justify-center p-8 bg-[#0F172A] text-white relative overflow-hidden">
                        {/* Background glow */}
                        <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div className="absolute bottom-0 right-0 w-96 h-96 bg-orange-600 blur-[120px] opacity-20 rounded-full"></div>

                        <div className={`text-center space-y-12 max-w-5xl relative z-10 transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                            <div className="reveal-text delay-100">
                                <h2 className="text-5xl md:text-8xl font-bold leading-none whitespace-pre-line serif-font tracking-tight">
                                    {slide.quote}
                                </h2>
                            </div>
                            <div className="w-32 h-1 bg-[#F97316] mx-auto rounded-full reveal-text delay-200 shadow-[0_0_20px_rgba(249,115,22,0.6)]"></div>
                            <div className="reveal-text delay-300">
                                <p className="text-2xl font-bold tracking-[0.2em] uppercase opacity-90 text-[#F97316] font-sans">
                                    {slide.brand}
                                </p>
                            </div>
                            <div className="mt-16 reveal-text delay-500">
                                <img src={LOGO_URL} alt="EDVOCATE" className="h-16 mx-auto brightness-0 invert opacity-80 hover:opacity-100 transition-opacity" />
                            </div>
                        </div>
                    </section>
                );
            }

            // Standard Layout
            return (
                <section ref={ref} className="h-screen w-full snap-start flex items-center justify-center p-6 md:p-12 relative">
                    <div className={`w-full max-w-7xl mx-auto transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                        
                        <div className="grid md:grid-cols-12 gap-8 md:gap-16 items-center">
                            
                            {/* Left: Narrative (Cols 1-6) */}
                            <div className="order-2 md:order-1 md:col-span-7 space-y-8 pr-4">
                                <div className="reveal-text delay-100 flex items-center gap-3">
                                    <span className="text-[#F97316] font-bold text-xs tracking-[0.2em] uppercase bg-orange-50 px-3 py-1 rounded-full border border-orange-100">
                                        Slide {slide.id}
                                    </span>
                                    <div className="h-px w-12 bg-orange-200"></div>
                                </div>
                                <div className="reveal-text delay-200">
                                    <h3 className="text-4xl md:text-5xl lg:text-6xl font-bold text-[#0F172A] leading-[1.1] serif-font">
                                        {slide.title}
                                    </h3>
                                </div>
                                <div className="reveal-text delay-300">
                                    <p className="text-xl text-[#475569] leading-relaxed font-light">
                                        {slide.body}
                                    </p>
                                </div>
                            </div>

                            {/* Right: Data Card & Illustration (Cols 7-12) */}
                            <div className="order-1 md:order-2 md:col-span-5 reveal-text delay-300 relative">
                                {/* Decorative elements behind card */}
                                <div className="absolute -top-10 -right-10 w-40 h-40 bg-orange-200 rounded-full blur-3xl opacity-40"></div>
                                
                                <TiltCard className="p-8 md:p-10 rounded-2xl relative flex flex-col items-center">
                                    
                                    {/* SVG Illustration Container */}
                                    <div className="w-full h-48 mb-8 bg-slate-50 rounded-xl p-4 border border-slate-100 shadow-inner">
                                        {Illustration && <Illustration />}
                                    </div>

                                    <div className="relative z-10 w-full text-center md:text-left">
                                        <div className="text-5xl md:text-6xl font-bold text-[#F97316] mb-3 tracking-tight serif-font">
                                            {slide.stat}
                                        </div>
                                        <p className="text-lg md:text-lg text-[#0F172A] font-medium leading-relaxed mb-6">
                                            {slide.statText}
                                        </p>
                                        <div className="pt-5 border-t border-slate-100 flex items-start gap-2">
                                            <div className="bg-slate-100 p-1 rounded">
                                                <svg className="w-3 h-3 text-slate-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                            </div>
                                            <div>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">
                                                    VERIFIED SOURCE
                                                </p>
                                                <p className="text-xs text-[#64748B] font-medium max-w-[200px]">
                                                    {slide.source}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </TiltCard>
                            </div>

                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const containerRef = useRef(null);
            const [progress, setProgress] = useState(0);

            const handleScroll = () => {
                if(containerRef.current) {
                    const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
                    const scrolled = scrollTop / (scrollHeight - clientHeight);
                    setProgress(scrolled * 100);
                }
            };

            return (
                <div className="relative w-full h-screen bg-[#FDFBF7]">
                    {/* Background Texture & Orbs */}
                    <div className="paper-texture"></div>
                    <div className="orb bg-orange-300 top-1/4 left-1/4 w-96 h-96 blur-[120px] opacity-20"></div>
                    <div className="orb bg-blue-200 bottom-1/4 right-1/4 w-80 h-80 blur-[100px] opacity-20 animation-delay-2000"></div>

                    {/* Progress Bar (Glassmorphism) */}
                    <div className="fixed top-6 right-6 w-16 h-16 z-50 flex items-center justify-center">
                        <svg className="w-full h-full transform -rotate-90">
                            <circle cx="32" cy="32" r="28" stroke="#E2E8F0" strokeWidth="4" fill="none" />
                            <circle 
                                cx="32" cy="32" r="28" 
                                stroke="#F97316" strokeWidth="4" fill="none" 
                                strokeDasharray="176" 
                                strokeDashoffset={176 - (176 * progress) / 100} 
                                className="transition-all duration-300 ease-out"
                            />
                        </svg>
                        <span className="absolute text-xs font-bold text-slate-400">{Math.round(progress)}%</span>
                    </div>

                    {/* Fixed Logo (Top Left) */}
                    <div className="fixed top-6 left-6 z-40 opacity-100 hover:opacity-80 transition-opacity cursor-pointer">
                        <img src={LOGO_URL} alt="EDVOCATE" className="h-8 w-auto" />
                    </div>

                    {/* Main Scroll Area */}
                    <main 
                        ref={containerRef} 
                        onScroll={handleScroll}
                        className="h-full w-full overflow-y-scroll snap-y snap-mandatory scroll-smooth no-scrollbar relative z-10"
                    >
                        {slides.map((slide, index) => (
                            <SlideRenderer key={index} slide={slide} index={index} total={slides.length} />
                        ))}
                        
                        <div className="h-32 w-full snap-start flex items-center justify-center text-slate-400 text-sm font-medium tracking-wide">
                            © 2026 EDVOCATE - Confidential Document
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
