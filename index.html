<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDVOCATE - Infrastructure Pitch 2026</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Averia Serif Libre"', 'serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#4361EE',
                            dark: '#3651CD',
                        }
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                    },
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons (Vanilla Version - Safer for inline React generation) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Averia Serif Libre', serif;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure globals from CDNs
        const { useState, useEffect, useRef } = React;

        // --- Custom Lucide Icon Wrapper ---
        // Converts vanilla Lucide icon definitions into React components
        // This avoids UMD dependency issues with lucide-react in simple HTML files
        const IconWrapper = ({ iconNode, size = 24, className = "", ...props }) => {
            return React.createElement(
                "svg",
                {
                    xmlns: "http://www.w3.org/2000/svg",
                    width: size,
                    height: size,
                    viewBox: "0 0 24 24",
                    fill: "none",
                    stroke: "currentColor",
                    strokeWidth: 2,
                    strokeLinecap: "round",
                    strokeLinejoin: "round",
                    className: className,
                    ...props
                },
                ...iconNode.map(([tag, attrs], index) => 
                    React.createElement(tag, { ...attrs, key: index })
                )
            );
        };

        // Create a map of React components from lucide.icons
        const LucideIcons = Object.keys(lucide.icons).reduce((acc, key) => {
            acc[key] = (props) => React.createElement(IconWrapper, { ...props, iconNode: lucide.icons[key] });
            return acc;
        }, {});

        // Destructure only the icons we need
        const { 
            ArrowRight, 
            Target, 
            Brain, 
            MapPin, 
            Users, 
            TrendingUp, 
            ShieldCheck, 
            Layers, 
            School, 
            Briefcase, 
            ChevronDown, 
            BarChart3, 
            Cpu, 
            Globe, 
            Award, 
            CheckCircle, 
            Mail, 
            Zap, 
            Activity 
        } = LucideIcons;

        // --- Animation Components ---

        const Reveal = ({ children, className = "", delay = 0, threshold = 0.1 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold }
                );
                if (ref.current) observer.observe(ref.current);
                return () => {
                    if (ref.current) observer.unobserve(ref.current);
                };
            }, [threshold]);

            return (
                <div
                    ref={ref}
                    className={`${className} transition-all duration-1000 cubic-bezier(0.17, 0.55, 0.55, 1) transform ${
                        isVisible ? "opacity-100 translate-y-0 scale-100" : "opacity-0 translate-y-12 scale-95"
                    }`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        const CountUp = ({ end, suffix = "", prefix = "", duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.disconnect();
                        }
                    },
                    { threshold: 0.5 }
                );
                if (ref.current) observer.observe(ref.current);
            }, []);

            useEffect(() => {
                if (!isVisible) return;
                
                let start = 0;
                // Parse the end value if it's a string (remove non-digits for calculation)
                const endVal = parseInt(String(end).replace(/[^0-9]/g, ''));
                if (start === endVal) return;

                let incrementTime = (duration / endVal) * Math.abs(endVal - start);
                // Cap speed for large numbers
                if (incrementTime < 10) incrementTime = 10;

                const timer = setInterval(() => {
                    start += Math.ceil(endVal / (duration / 20)); // approximate steps
                    if (start >= endVal) {
                        start = endVal;
                        clearInterval(timer);
                    }
                    setCount(start);
                }, 20);

                return () => clearInterval(timer);
            }, [end, duration, isVisible]);

            return (
                <span ref={ref} className="tabular-nums">
                    {prefix}{count.toLocaleString()}{suffix}
                </span>
            );
        };

        const EdvocatePitch = () => {
            const [activeSection, setActiveSection] = useState('hero');
            const [scrolled, setScrolled] = useState(false);

            // Handle scroll for navigation highlighting
            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setActiveSection(id);
                }
            };

            const NavItem = ({ id, label }) => (
                <button 
                    onClick={() => scrollToSection(id)}
                    className={`px-4 py-2 text-sm font-medium transition-all duration-300 relative group ${
                        activeSection === id ? 'text-[#4361EE]' : 'text-slate-600 hover:text-[#4361EE]'
                    }`}
                >
                    {label}
                    <span className={`absolute bottom-0 left-0 h-0.5 bg-[#4361EE] transition-all duration-300 ${activeSection === id ? 'w-full' : 'w-0 group-hover:w-full'}`}></span>
                </button>
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 selection:bg-blue-200 selection:text-blue-900 overflow-x-hidden">
                    
                    {/* Dynamic Background */}
                    <div className="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
                        <div className="absolute top-0 left-1/4 w-[500px] h-[500px] bg-[#4361EE]/10 rounded-full blur-[100px] animate-pulse"></div>
                        <div className="absolute bottom-0 right-1/4 w-[600px] h-[600px] bg-indigo-400/20 rounded-full blur-[120px] animate-pulse" style={{ animationDelay: '2s' }}></div>
                    </div>

                    {/* Navigation */}
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-500 border-b ${scrolled ? 'bg-white/80 backdrop-blur-xl border-slate-200 py-3 shadow-sm' : 'bg-transparent border-transparent py-6'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            {/* Logo Update: No gap, #4361EE Hex */}
                            <div className="flex items-center gap-0 group cursor-pointer" onClick={() => scrollToSection('hero')}>
                                <div className="bg-[#4361EE] text-white p-2 px-3 rounded-l-xl rounded-r-none font-bold text-xl tracking-tighter shadow-lg group-hover:brightness-110 transition-all duration-300">ED</div>
                                <span className="bg-white/50 backdrop-blur-sm border border-l-0 border-slate-200 p-2 pr-3 rounded-r-xl font-bold text-xl text-slate-800 tracking-tight group-hover:text-[#4361EE] transition-colors">VOCATE</span>
                            </div>
                            <div className="hidden md:flex gap-1">
                                <NavItem id="problem" label="Problem" />
                                <NavItem id="solution" label="Solution" />
                                <NavItem id="product" label="Product" />
                                <NavItem id="market" label="Market" />
                                <NavItem id="roadmap" label="Roadmap" />
                                <NavItem id="financials" label="Financials" />
                            </div>
                            <button onClick={() => window.location.href = 'mailto:hello@edvocate.in'} className="bg-slate-900 text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-slate-800 transition-all hover:scale-105 hover:shadow-xl hover:shadow-blue-900/20 flex items-center gap-2 active:scale-95">
                                <Mail className="w-4 h-4" /> Invest
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header id="hero" className="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 -z-10"></div>
                        
                        <div className="max-w-7xl mx-auto px-6 text-center">
                            <Reveal>
                                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/50 border border-blue-200 text-[#4361EE] text-xs font-bold uppercase tracking-wide mb-8 backdrop-blur-sm shadow-sm hover:scale-105 transition-transform cursor-default">
                                    <Zap className="w-3 h-3 fill-current" /> Infrastructure Pitch 2026
                                </div>
                            </Reveal>
                            
                            <Reveal delay={100}>
                                <h1 className="text-5xl md:text-8xl font-bold text-slate-900 tracking-tight mb-8 leading-[0.9]">
                                    Building India’s <br/>
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#4361EE] via-indigo-600 to-cyan-500 animate-gradient-x">Career Decision</span>
                                    <br/>Infrastructure
                                </h1>
                            </Reveal>

                            <Reveal delay={200}>
                                <p className="text-xl md:text-2xl text-slate-600 max-w-3xl mx-auto mb-12 leading-relaxed">
                                    We don't predict futures. We engineer the <span className="font-bold text-slate-900">decision layer</span> connecting 30M+ students to the right education, skills, and careers at a national scale.
                                </p>
                            </Reveal>

                            <Reveal delay={300}>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                                    <button onClick={() => scrollToSection('problem')} className="group relative inline-flex items-center justify-center gap-2 px-8 py-4 bg-[#4361EE] text-white rounded-full font-bold hover:bg-blue-700 transition-all shadow-[0_10px_40px_-10px_rgba(67,97,238,0.5)] hover:shadow-[0_20px_40px_-10px_rgba(67,97,238,0.6)] hover:-translate-y-1">
                                        Explore The Vision 
                                        <ArrowRight className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                                    </button>
                                    <button onClick={() => scrollToSection('financials')} className="px-8 py-4 text-slate-600 font-bold hover:text-[#4361EE] transition-colors">
                                        View Financials
                                    </button>
                                </div>
                            </Reveal>
                            
                            {/* Stats Banner */}
                            <div className="mt-24 max-w-5xl mx-auto border-t border-slate-200/60 pt-10">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                                    {[
                                        { label: 'Annual Students', value: 30, suffix: 'M+' },
                                        { label: 'School Students', value: 250, suffix: 'M+' },
                                        { label: 'College Students', value: 40, suffix: 'M+' },
                                        { label: 'Market Opportunity', value: 34000, prefix: '₹', suffix: 'Cr' }
                                    ].map((stat, i) => (
                                        <Reveal key={i} delay={400 + (i * 100)}>
                                            <div className="text-center group cursor-default">
                                                <div className="text-3xl md:text-4xl font-bold text-slate-900 group-hover:text-[#4361EE] transition-colors">
                                                    <CountUp end={stat.value} suffix={stat.suffix} prefix={stat.prefix} />
                                                </div>
                                                <div className="text-xs text-slate-500 font-bold uppercase tracking-widest mt-2">{stat.label}</div>
                                            </div>
                                        </Reveal>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Problem Section */}
                    <section id="problem" className="py-24 bg-white relative">
                        <div className="max-w-7xl mx-auto px-6">
                            <Reveal>
                                <div className="text-center mb-16">
                                    <h2 className="text-3xl md:text-5xl font-bold text-slate-900 mb-6">The Structural Failure</h2>
                                    <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                                        Students rely on social pressure and random advice, leading to a massive misalignment of talent and opportunity.
                                    </p>
                                </div>
                            </Reveal>

                            <div className="grid md:grid-cols-3 gap-8">
                                {[
                                    { icon: Brain, color: 'red', title: 'Decision Chaos', desc: 'Thousands of courses and roles with no unified comparison framework. Students lack the data to compare options objectively.' },
                                    { icon: Layers, color: 'orange', title: 'Fragmented Ecosystem', desc: 'Skill training is scattered across portals and poorly mapped to actual career demand. No coordination exists.' },
                                    { icon: MapPin, color: 'blue', title: 'Unscalable Counseling', desc: 'Traditional counseling is expensive, city-centric, and inconsistent. It cannot serve rural India effectively.' }
                                ].map((item, i) => (
                                    <Reveal key={i} delay={i * 150} className="h-full">
                                        <div className={`h-full bg-slate-50 rounded-3xl p-8 border border-slate-100 transition-all duration-300 hover:shadow-2xl hover:-translate-y-2 hover:bg-white group relative overflow-hidden`}>
                                            <div className={`absolute top-0 right-0 w-32 h-32 bg-${item.color}-500/5 rounded-full blur-3xl -mr-16 -mt-16 transition-all group-hover:bg-${item.color}-500/10`}></div>
                                            <div className={`w-14 h-14 bg-${item.color}-100 text-${item.color}-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-500 shadow-sm`}>
                                                <item.icon className="w-7 h-7" />
                                            </div>
                                            <h3 className="text-xl font-bold mb-4 text-slate-900">{item.title}</h3>
                                            <p className="text-slate-600 leading-relaxed text-sm">
                                                {item.desc}
                                            </p>
                                        </div>
                                    </Reveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Solution / Engine Visualization */}
                    <section id="solution" className="py-32 bg-[#0F172A] text-white overflow-hidden relative">
                        {/* Animated Background Elements */}
                        <div className="absolute top-0 right-0 -mr-20 -mt-20 w-[600px] h-[600px] bg-[#4361EE]/20 rounded-full blur-[128px] animate-pulse"></div>
                        <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[128px] animate-pulse" style={{ animationDelay: '3s' }}></div>

                        <div className="max-w-7xl mx-auto px-6 relative z-10">
                            <Reveal>
                                <div className="text-center mb-20">
                                    <span className="inline-block py-1 px-3 rounded-full bg-[#4361EE]/10 text-[#4361EE] font-bold tracking-widest uppercase text-xs border border-[#4361EE]/20 mb-4">The Solution</span>
                                    <h2 className="text-4xl md:text-6xl font-bold">The EDVOCATE Engine</h2>
                                    <p className="text-slate-400 mt-6 max-w-2xl mx-auto text-lg">
                                        We convert unstructured student data into structured career, education, and skill pathways.
                                    </p>
                                </div>
                            </Reveal>

                            {/* Engine Workflow Diagram */}
                            <div className="grid lg:grid-cols-3 gap-6 items-stretch">
                                {/* Input Layer */}
                                <Reveal delay={100} className="h-full">
                                    <div className="h-full bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur-md relative hover:bg-white/10 transition-colors">
                                        <div className="absolute -top-4 left-8 bg-[#4361EE] text-xs font-bold px-4 py-1.5 rounded-full shadow-lg shadow-blue-900/50">STEP 1</div>
                                        <div className="flex items-center gap-4 mb-8">
                                            <div className="p-3 bg-[#4361EE]/20 rounded-xl">
                                                <Users className="w-6 h-6 text-blue-400" />
                                            </div>
                                            <h3 className="text-2xl font-bold">Input Layer</h3>
                                        </div>
                                        <ul className="space-y-4 text-slate-300">
                                            {['Academic Level', 'Subject Interests', 'Strength Traits', 'Geo-Location'].map((item, i) => (
                                                <li key={i} className="flex items-center gap-3 bg-white/5 p-4 rounded-xl border border-white/5 hover:border-[#4361EE]/30 transition-colors">
                                                    <div className="w-2 h-2 rounded-full bg-[#4361EE] shadow-[0_0_10px_rgba(67,97,238,0.8)]"></div> {item}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </Reveal>

                                {/* Processing Layer (Center) */}
                                <Reveal delay={300} className="h-full">
                                    <div className="h-full bg-gradient-to-b from-[#4361EE]/40 to-slate-900/40 border border-[#4361EE]/30 rounded-3xl p-8 flex flex-col justify-center relative shadow-[0_0_50px_rgba(67,97,238,0.15)] overflow-hidden group">
                                        <div className="absolute inset-0 bg-[#4361EE]/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-cyan-500 text-black text-xs font-bold px-4 py-1.5 rounded-full shadow-[0_0_20px_rgba(6,182,212,0.6)]">CORE ENGINE</div>
                                        <div className="flex justify-center mb-8 relative">
                                            <div className="absolute inset-0 bg-cyan-500/30 blur-2xl rounded-full scale-50 animate-pulse"></div>
                                            <Cpu className="w-16 h-16 text-cyan-400 relative z-10 drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]" />
                                        </div>
                                        <h3 className="text-2xl font-bold text-center mb-8">Logic Processing</h3>
                                        <div className="space-y-4">
                                            {[
                                                { l: 'Role Compatibility', r: '98%' },
                                                { l: 'Eligibility Checks', r: 'Active' },
                                                { l: 'Market Demand', r: 'Real-time' },
                                                { l: 'College Mapping', r: '< 60km' }
                                            ].map((row, i) => (
                                                <div key={i} className="flex justify-between text-sm text-cyan-200 border-b border-cyan-500/20 pb-3 px-2">
                                                    <span>{row.l}</span>
                                                    <span className="font-mono">{row.r}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </Reveal>

                                {/* Output Layer */}
                                <Reveal delay={500} className="h-full">
                                    <div className="h-full bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur-md relative hover:bg-white/10 transition-colors">
                                        <div className="absolute -top-4 right-8 bg-emerald-500 text-black text-xs font-bold px-4 py-1.5 rounded-full shadow-lg shadow-emerald-900/50">STEP 3</div>
                                        <div className="flex items-center gap-4 mb-8">
                                            <div className="p-3 bg-emerald-500/20 rounded-xl">
                                                <Target className="w-6 h-6 text-emerald-400" />
                                            </div>
                                            <h3 className="text-2xl font-bold">Output Layer</h3>
                                        </div>
                                        <div className="space-y-4">
                                            {[
                                                { t: 'Career Blueprint', d: 'Full roadmap & Role shortlists' },
                                                { t: 'Institution Match', d: 'Colleges within 60km + State' },
                                                { t: 'Skill Gap Analysis', d: 'Readiness & Learning Resources' }
                                            ].map((card, i) => (
                                                <div key={i} className="bg-emerald-500/10 border border-emerald-500/20 p-5 rounded-xl hover:bg-emerald-500/20 transition-colors">
                                                    <h4 className="font-bold text-emerald-400 text-sm mb-1 flex items-center gap-2">
                                                        <CheckCircle className="w-3 h-3" /> {card.t}
                                                    </h4>
                                                    <p className="text-xs text-slate-400 pl-5">{card.d}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </Reveal>
                            </div>
                        </div>
                    </section>

                    {/* Product & Strategy */}
                    <section id="product" className="py-24 bg-slate-50 relative overflow-hidden">
                        <div className="max-w-7xl mx-auto px-6 relative z-10">
                            <div className="flex flex-col md:flex-row gap-16 items-start">
                                
                                {/* Left: Product Stack */}
                                <div className="md:w-1/2">
                                    <Reveal>
                                        <h2 className="text-3xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                                            Product Ecosystem <div className="h-1 flex-grow bg-slate-200 rounded-full ml-4"></div>
                                        </h2>
                                    </Reveal>
                                    
                                    <div className="space-y-6">
                                        {[
                                            { icon: Briefcase, color: 'blue', title: 'Career Decision Report', price: '₹299 – ₹499 per student', desc: 'Full roadmap, college matching, skill mapping, and sector outlook. Automated & Scalable.' },
                                            { icon: School, color: 'purple', title: 'Institutional Dashboard', price: 'B2B Contracts', desc: 'Schools generate bulk reports, batch analytics, and career outcome tracking.' },
                                            { icon: TrendingUp, color: 'emerald', title: 'Skill Enablement Layer', price: 'Commission Model', desc: 'Curated marketplace for 3rd party training providers based on skill gaps.' }
                                        ].map((item, i) => (
                                            <Reveal key={i} delay={i * 100}>
                                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex gap-5 hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                                                    <div className={`bg-${item.color}-50 p-4 rounded-xl h-fit`}>
                                                        <item.icon className={`w-6 h-6 text-${item.color}-600`} />
                                                    </div>
                                                    <div>
                                                        <h3 className="text-xl font-bold text-slate-900">{item.title}</h3>
                                                        <div className={`text-sm font-bold text-${item.color}-600 mt-1 mb-2 bg-${item.color}-50 inline-block px-2 py-0.5 rounded`}>{item.price}</div>
                                                        <p className="text-slate-600 text-sm leading-relaxed">{item.desc}</p>
                                                    </div>
                                                </div>
                                            </Reveal>
                                        ))}
                                    </div>
                                </div>

                                {/* Right: Offline Strategy */}
                                <div className="md:w-1/2">
                                    <Reveal delay={200}>
                                        <div className="bg-slate-900 text-white rounded-[2rem] p-10 relative overflow-hidden shadow-2xl">
                                            <div className="absolute top-0 right-0 w-64 h-64 bg-[#4361EE] rounded-full blur-[80px] -mr-16 -mt-16 opacity-50"></div>
                                            
                                            <h3 className="text-2xl font-bold mb-6 relative z-10 flex items-center gap-3">
                                                <Globe className="text-blue-400" /> Hybrid Expansion
                                            </h3>
                                            <p className="text-slate-300 mb-10 relative z-10 leading-relaxed">
                                                We do NOT build permanent centers initially. We use a <span className="text-white font-bold">demand-triggered, asset-light model</span>.
                                            </p>

                                            <div className="space-y-2 relative z-10">
                                                {[
                                                    { icon: Activity, title: '1. Digital Demand', desc: 'User density & skill gap clusters identified via app' },
                                                    { icon: School, title: '2. Co-Space Activation', desc: 'Temp classrooms in partner colleges/community halls' },
                                                    { icon: MapPin, title: '3. Permanent Hub', desc: 'High-demand locations evolve into fixed centers' }
                                                ].map((step, i) => (
                                                    <React.Fragment key={i}>
                                                        <div className="flex items-center gap-5 bg-white/10 p-5 rounded-xl border border-white/5 backdrop-blur-sm">
                                                            <step.icon className={`w-8 h-8 ${i===0 ? 'text-blue-400' : i===1 ? 'text-indigo-400' : 'text-emerald-400'}`} />
                                                            <div>
                                                                <div className="font-bold text-lg">{step.title}</div>
                                                                <div className="text-xs text-slate-400 mt-1">{step.desc}</div>
                                                            </div>
                                                        </div>
                                                        {i < 2 && (
                                                            <div className="flex justify-center py-2">
                                                                <ChevronDown className="text-slate-600 animate-bounce" />
                                                            </div>
                                                        )}
                                                    </React.Fragment>
                                                ))}
                                            </div>
                                        </div>
                                    </Reveal>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Market & Competitive Advantage */}
                    <section id="market" className="py-24 bg-white border-t border-slate-100">
                        <div className="max-w-7xl mx-auto px-6">
                            <Reveal>
                                <div className="mb-20 text-center">
                                    <span className="text-[#4361EE] font-bold uppercase text-xs tracking-widest mb-2 block">Competitive Landscape</span>
                                    <h2 className="text-4xl font-bold text-slate-900">Why EDVOCATE Wins</h2>
                                </div>
                            </Reveal>

                            <div className="grid md:grid-cols-2 gap-16">
                                {/* Advantage */}
                                <div>
                                    <Reveal>
                                        <h3 className="text-2xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                                            <ShieldCheck className="w-8 h-8 text-[#4361EE]" /> Strategic Moat
                                        </h3>
                                    </Reveal>
                                    <ul className="space-y-8">
                                        {[
                                            { t: 'Infrastructure, Not Content', d: 'Competitors sell courses/content. We sell decision logic and ecosystem orchestration.' },
                                            { t: 'Location Intelligence', d: 'We map colleges and training to geography (60km radius logic).' },
                                            { t: 'Data Flywheel', d: 'More users → better decisions → higher trust → more institutions.' },
                                            { t: 'Trust & Compliance', d: 'No admission guarantees. Transparent disclaimers. Built for regulation.' }
                                        ].map((item, i) => (
                                            <Reveal key={i} delay={i * 100}>
                                                <li className="flex gap-5">
                                                    <div className="mt-1">
                                                        <CheckCircle className="w-6 h-6 text-emerald-500 shrink-0 shadow-sm rounded-full" />
                                                    </div>
                                                    <div>
                                                        <strong className="block text-lg text-slate-900 mb-1">{item.t}</strong>
                                                        <span className="text-slate-600 text-sm leading-relaxed">{item.d}</span>
                                                    </div>
                                                </li>
                                            </Reveal>
                                        ))}
                                    </ul>
                                </div>

                                {/* Revenue Model */}
                                <Reveal delay={200}>
                                    <div className="bg-slate-50 p-10 rounded-[2.5rem] border border-slate-200 shadow-xl relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-[#4361EE]/10 rounded-full -mr-10 -mt-10"></div>
                                        <h3 className="text-2xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                                            <BarChart3 className="w-8 h-8 text-[#4361EE]" /> Revenue Architecture
                                        </h3>
                                        
                                        <div className="space-y-5">
                                            {[
                                                { n: '1', t: 'Direct B2C', s: 'Reports (₹299+) & Premium Guidance', c: 'blue' },
                                                { n: '2', t: 'Institutional', s: 'Bulk Analytics & Dashboards', c: 'purple' },
                                                { n: '3', t: 'Marketplace', s: 'Skill Partner Commissions', c: 'emerald' },
                                                { n: '4', t: 'Future (SaaS)', s: 'Workforce Skilling Programs', c: 'slate' }
                                            ].map((rev, i) => (
                                                <div key={i} className={`flex items-center justify-between p-5 bg-white rounded-2xl shadow-sm border border-slate-100 hover:scale-[1.02] transition-transform duration-300 ${rev.c === 'slate' ? 'opacity-60 grayscale' : ''}`}>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`bg-${rev.c}-100 w-10 h-10 flex items-center justify-center rounded-xl text-${rev.c}-600 font-bold shadow-inner`}>{rev.n}</div>
                                                        <span className="font-bold text-lg text-slate-800">{rev.t}</span>
                                                    </div>
                                                    <span className="text-slate-500 text-xs font-medium bg-slate-50 px-3 py-1 rounded-full border border-slate-100">{rev.s}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </Reveal>
                            </div>
                        </div>
                    </section>

                    {/* Roadmap */}
                    <section id="roadmap" className="py-24 bg-slate-900 text-white relative">
                        <div className="max-w-7xl mx-auto px-6">
                            <Reveal>
                                <h2 className="text-3xl md:text-5xl font-bold text-center mb-20">Execution Roadmap</h2>
                            </Reveal>
                            
                            <div className="relative">
                                {/* Animated Line */}
                                <div className="absolute top-8 left-0 w-full h-1 bg-gradient-to-r from-[#4361EE] via-purple-600 to-slate-800 hidden md:block rounded-full opacity-50"></div>
                                
                                <div className="grid md:grid-cols-3 gap-10">
                                    {[
                                        { p: 'PHASE 1 (0-12 Mo)', t: 'Foundation', items: ['Pan-India PWA Launch', 'Report Monetization', 'Institutional Onboarding', 'Brand Trust Building'], c: 'blue' },
                                        { p: 'PHASE 2 (12-24 Mo)', t: 'Expansion', items: ['Premium Guidance Layer', 'Skill Marketplace Integration', 'Advanced Analytics Dashboard'], c: 'purple' },
                                        { p: 'PHASE 3 (24+ Mo)', t: 'Ecosystem', items: ['Offline Training Hubs', 'Enterprise Partnerships', 'Workforce Skilling Programs'], c: 'slate' }
                                    ].map((phase, i) => (
                                        <Reveal key={i} delay={i * 200}>
                                            <div className="relative pt-16 group">
                                                <div className={`absolute top-6 left-0 md:left-1/2 md:-translate-x-1/2 w-6 h-6 bg-${phase.c}-500 rounded-full border-4 border-slate-900 z-10 shadow-[0_0_20px_rgba(59,130,246,0.5)] group-hover:scale-125 transition-transform`}></div>
                                                <div className={`bg-white/5 border border-white/10 p-8 rounded-2xl backdrop-blur-sm group-hover:bg-white/10 transition-colors ${i===2 ? 'opacity-60' : ''}`}>
                                                    <div className={`text-${phase.c}-400 font-bold mb-3 text-xs tracking-wider`}>{phase.p}</div>
                                                    <h3 className="text-2xl font-bold mb-6">{phase.t}</h3>
                                                    <ul className="space-y-3 text-sm text-slate-400">
                                                        {phase.items.map((item, idx) => (
                                                            <li key={idx} className="flex items-start gap-2">
                                                                <span className="mt-1.5 w-1.5 h-1.5 bg-slate-500 rounded-full"></span> {item}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            </div>
                                        </Reveal>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Financials Section */}
                    <section id="financials" className="py-32 bg-white relative">
                        <div className="max-w-7xl mx-auto px-6">
                            <Reveal>
                                <div className="text-center mb-20">
                                    <span className="text-green-600 font-bold tracking-widest uppercase text-xs mb-3 block">Growth & Scale</span>
                                    <h2 className="text-4xl md:text-6xl font-bold text-slate-900">Financial Framework</h2>
                                    <p className="text-slate-500 mt-6 max-w-2xl mx-auto text-lg">
                                        Market size validation, revenue capture strategy, and valuation pathway.
                                    </p>
                                </div>
                            </Reveal>

                            {/* TAM - SAM - SOM */}
                            <div className="grid md:grid-cols-3 gap-8 mb-24">
                                {[
                                    { t: 'TAM', sub: 'Total Addressable', v: 34385, color: 'slate', desc: 'Annual Revenue Potential' },
                                    { t: 'SAM', sub: 'Serviceable Available', v: 9177, color: 'blue', desc: 'Digital Serviceable Market' },
                                    { t: 'SOM', sub: 'Obtainable (36 Mo)', v: 14, color: 'green', desc: 'Target ARR (Year 2-3)' }
                                ].map((box, i) => (
                                    <Reveal key={i} delay={i * 150} className="h-full">
                                        <div className={`h-full bg-${box.color}-50 rounded-3xl p-8 border border-${box.color}-100 flex flex-col justify-between hover:scale-105 transition-transform duration-500 shadow-sm hover:shadow-xl`}>
                                            <div>
                                                <div className="flex justify-between items-start mb-6">
                                                    <h3 className={`text-3xl font-black text-${box.color}-300`}>{box.t}</h3>
                                                    <div className={`bg-${box.color}-200/50 text-${box.color}-800 text-[10px] font-bold px-2 py-1 rounded uppercase`}>{box.sub}</div>
                                                </div>
                                                <div className={`text-4xl lg:text-5xl font-bold text-${box.color}-900 mb-2 tracking-tight`}>
                                                    <CountUp end={box.v} prefix="₹" suffix=" Cr" />
                                                </div>
                                                <div className={`text-sm text-${box.color}-600 font-medium`}>{box.desc}</div>
                                            </div>
                                            <div className={`w-full h-1 bg-${box.color}-200 mt-8 rounded-full overflow-hidden`}>
                                                <div className={`h-full bg-${box.color}-500 w-1/2`}></div>
                                            </div>
                                        </div>
                                    </Reveal>
                                ))}
                            </div>

                            {/* Valuation Chart */}
                            <Reveal delay={300}>
                                <div className="bg-[#0B1121] rounded-[3rem] p-10 md:p-16 text-white overflow-hidden relative shadow-2xl">
                                    <div className="absolute top-0 right-0 w-[600px] h-[600px] bg-[#4361EE]/10 rounded-full blur-[120px] -mr-32 -mt-32 animate-pulse"></div>
                                    
                                    <h3 className="text-3xl font-bold mb-16 flex items-center gap-4 relative z-10">
                                        <TrendingUp className="text-green-400 w-8 h-8" /> Valuation Mapping
                                    </h3>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-12 items-end relative z-10 h-80 border-b border-slate-800 pb-8 mb-8">
                                        {[
                                            { l: 'PRE-SEED', v: 16, h: 'h-16', c: 'bg-slate-700' },
                                            { l: 'YEAR 1', v: 21, h: 'h-24', c: 'bg-blue-800' },
                                            { l: 'YEAR 2', v: 109, h: 'h-48', c: 'bg-blue-600' },
                                            { l: 'YEAR 3', v: 270, h: 'h-full', c: 'bg-gradient-to-t from-green-600 to-green-400' }
                                        ].map((bar, i) => (
                                            <div key={i} className="w-full flex flex-col items-center gap-4 group h-full justify-end">
                                                <div className="text-center opacity-0 group-hover:opacity-100 transition-all duration-500 transform translate-y-4 group-hover:translate-y-0">
                                                    <div className="text-3xl font-bold mb-1">₹{bar.v}Cr</div>
                                                </div>
                                                <div className={`w-full ${bar.c} ${bar.h} rounded-t-2xl relative group-hover:brightness-110 transition-all shadow-lg`}></div>
                                                <div className="text-xs font-bold text-slate-400 tracking-widest">{bar.l}</div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Exit Scenarios Grid */}
                                    <div className="grid md:grid-cols-3 gap-8 mt-12 pt-4 relative z-10">
                                        {[
                                            { t: 'EdTech Buyout', v: '₹60-120 Cr', d: 'Acquisition by UpGrad, PhysicsWallah, etc.' },
                                            { t: 'Workforce Platform', v: '₹100-180 Cr', d: 'Acquisition by Indeed, TeamLease, Apna.' },
                                            { t: 'Strategic Integration', v: '₹200-300 Cr', d: 'Government / National Career Infra Partner.', special: true }
                                        ].map((exit, i) => (
                                            <div key={i} className={`p-6 rounded-2xl ${exit.special ? 'bg-green-900/20 border border-green-500/30' : 'bg-white/5 border border-white/5'}`}>
                                                <h4 className={`font-bold text-sm mb-3 uppercase tracking-wider ${exit.special ? 'text-green-400' : 'text-blue-300'}`}>{exit.t}</h4>
                                                <div className="text-3xl font-bold mb-2">{exit.v}</div>
                                                <p className="text-xs text-slate-400 leading-relaxed opacity-70">{exit.d}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </Reveal>
                        </div>
                    </section>

                    {/* Fundraising & Vision */}
                    <section id="ask" className="py-32 bg-gradient-to-br from-blue-700 to-indigo-800 text-white relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
                        <div className="max-w-7xl mx-auto px-6 relative z-10">
                            <div className="grid md:grid-cols-2 gap-20 items-center">
                                <div>
                                    <Reveal>
                                        <h2 className="text-5xl font-bold mb-10">Investment Opportunity</h2>
                                    </Reveal>
                                    <Reveal delay={100}>
                                        <div className="bg-white/10 backdrop-blur-xl rounded-[2rem] p-10 border border-white/20 shadow-2xl">
                                            <div className="flex justify-between items-end mb-8">
                                                <div>
                                                    <div className="text-xs font-bold text-blue-200 uppercase tracking-widest mb-2">Target Raise (Pre-Seed)</div>
                                                    <div className="text-5xl font-bold">₹1.5 - 2.5 Cr</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-xs font-bold text-blue-200 uppercase tracking-widest mb-2">Equity Dilution</div>
                                                    <div className="text-3xl font-bold">10% – 15%</div>
                                                </div>
                                            </div>
                                            
                                            <div className="w-full h-px bg-white/20 my-8"></div>
                                            
                                            <h4 className="font-bold mb-6 text-blue-100 uppercase text-sm tracking-wider">Use of Funds</h4>
                                            <div className="grid grid-cols-2 gap-y-4 gap-x-8 text-sm font-medium">
                                                {['Platform Development', 'Backend Scaling', 'Marketing & Partnerships', 'Operations & Compliance'].map((use, i) => (
                                                    <div key={i} className="flex items-center gap-3">
                                                        <div className="w-2 h-2 bg-blue-300 rounded-full shadow-[0_0_10px_rgba(147,197,253,0.8)]"></div> {use}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </Reveal>
                                    
                                    <Reveal delay={200}>
                                        <div className="mt-10 flex items-center gap-4 text-blue-100 bg-blue-900/40 p-5 rounded-2xl backdrop-blur-sm border border-blue-400/30">
                                            <div className="bg-blue-500 p-2 rounded-full">
                                                <Mail className="w-5 h-5 text-white" /> 
                                            </div>
                                            <span className="text-base">Contact for Deck & Term Sheet: <strong className="text-white block md:inline">hello@edvocate.in</strong></span>
                                        </div>
                                    </Reveal>
                                </div>

                                <div className="text-center md:text-left">
                                    <Reveal delay={300}>
                                        <Award className="w-20 h-20 text-blue-300 mb-8 mx-auto md:mx-0 drop-shadow-[0_0_15px_rgba(147,197,253,0.5)]" />
                                        <h2 className="text-4xl font-bold mb-8">The Final Vision</h2>
                                        <p className="text-2xl text-blue-100 leading-relaxed mb-10 font-light">
                                            Education produces degrees. <br/>Skills produce jobs. <br/>
                                            <span className="text-white font-bold underline decoration-blue-400 underline-offset-8 decoration-4">Decisions shape futures.</span>
                                        </p>
                                        <p className="text-lg text-blue-200 mb-12 max-w-md mx-auto md:mx-0">
                                            EDVOCATE is building the system that powers those decisions for the next generation of India.
                                        </p>
                                        <button onClick={() => window.location.href = 'mailto:hello@edvocate.in'} className="bg-white text-blue-700 px-10 py-4 rounded-full font-bold text-lg hover:bg-blue-50 transition-all shadow-[0_10px_30px_-10px_rgba(255,255,255,0.3)] hover:-translate-y-1 hover:shadow-[0_20px_40px_-10px_rgba(255,255,255,0.4)]">
                                            Schedule Investor Meeting
                                        </button>
                                    </Reveal>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-slate-950 py-16 text-slate-500 text-sm text-center border-t border-slate-900">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex items-center justify-center gap-0 mb-6 opacity-50 hover:opacity-100 transition-opacity duration-300">
                                <div className="bg-[#4361EE] text-white p-1.5 px-2 rounded-l-lg font-bold text-sm">ED</div>
                                <span className="bg-slate-800 text-slate-300 p-1.5 px-2 rounded-r-lg font-bold text-sm">VOCATE</span>
                            </div>
                            <p className="mb-4">© 2026 Edvocate Technologies. India's Career Decision Infrastructure.</p>
                            <a href="mailto:hello@edvocate.in" className="text-slate-600 hover:text-white transition-colors border-b border-transparent hover:border-slate-600 pb-0.5">hello@edvocate.in</a>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EdvocatePitch />);
    </script>
</body>
</html>
