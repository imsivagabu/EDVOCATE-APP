<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDVOCATE - Keynote Deck</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-slide: #050505;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --accent: #F97316; /* Orange-500 */
        }

        body { 
            background-color: #000; 
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Averia Serif Libre', serif;
        }

        /* The Stage */
        #presentation-stage {
            width: 1920px;
            height: 1080px;
            background-color: var(--bg-slide);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transform-origin: center center;
        }

        /* Slide Transitions */
        .slide-container {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(1.02) translateY(10px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
            z-index: 0;
        }

        .slide-container.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            z-index: 10;
        }

        /* Animations */
        .animate-in { opacity: 0; transform: translateY(20px); transition: all 1s ease-out; }
        .active .animate-in { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }

        /* Chart Animations */
        .grow-width { width: 0; transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s; }
        .active .grow-width { width: var(--target-width); }
        
        .grow-height { height: 0; transition: height 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s; }
        .active .grow-height { height: var(--target-height); }

        .draw-circle { stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 2s ease-out 0.5s; }
        .active .draw-circle { stroke-dashoffset: 0; }

        .noise {
            position: absolute;
            inset: 0;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const LOGO_URL = "https://raw.githubusercontent.com/imsivagabu/EDvocate-Logo/f41285224d83b110daddff1a18fbabf97dcbf6af/Logo%20Design.png";

        // --- Visualization Components ---

        // 1. Dual-Track Timeline
        const TimelineViz = () => {
            const [hovered, setHovered] = useState(null);
            return (
                <div className="w-full h-full flex flex-col justify-center px-8 relative">
                    <div className="absolute inset-0 grid grid-cols-4 pointer-events-none opacity-10">
                        <div className="border-r border-white"></div>
                        <div className="border-r border-white"></div>
                        <div className="border-r border-white"></div>
                        <div className="border-r border-white"></div>
                    </div>
                    <div className="absolute top-10 w-full flex justify-between text-xs text-gray-500 font-bold uppercase tracking-widest px-8">
                        <span>Age 12</span>
                        <span>Age 14</span>
                        <span>Age 16</span>
                        <span>Age 18+</span>
                    </div>
                    <div className="mb-12 relative group">
                        <div className="text-sm text-gray-400 mb-2 uppercase tracking-wide">Global Standard</div>
                        <div className="h-4 w-full bg-gray-800 rounded-full overflow-hidden flex relative">
                            <div className="w-3/4 bg-blue-500/20 hover:bg-blue-500/40 transition-colors cursor-help"></div>
                            <div className="w-1/4 bg-blue-500"></div>
                        </div>
                        <div className="absolute right-0 top-6 text-right">
                            <div className="w-0.5 h-6 bg-blue-500 mx-auto mb-1"></div>
                            <span className="text-blue-400 font-bold">Decision @ 18</span>
                        </div>
                    </div>
                    <div className="relative group">
                        <div className="text-sm text-orange-400 mb-2 uppercase tracking-wide">India Reality</div>
                        <div className="h-4 w-full bg-gray-800 rounded-full overflow-hidden flex relative">
                            <div className="w-1/3 bg-orange-600/20"></div>
                            <div className="w-2/3 bg-orange-600 relative">
                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')] opacity-20"></div>
                            </div>
                        </div>
                        <div className="absolute left-[33%] top-6 text-center">
                            <div className="w-0.5 h-6 bg-orange-500 mx-auto mb-1 animate-pulse"></div>
                            <span className="text-orange-500 font-bold bg-black/50 px-2 rounded">Locked-in @ 15</span>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Multi-Benchmark Bar Chart
        const BenchmarkViz = () => {
            const data = [
                { label: 'USA', val: 250, h: '8%', color: 'bg-gray-600' },
                { label: 'Global Rec.', val: 250, h: '8%', color: 'bg-blue-600' },
                { label: 'India', val: 3000, h: '95%', color: 'bg-orange-600' }
            ];
            return (
                <div className="w-full h-full flex items-end justify-center gap-16 pb-8 relative">
                    {data.map((d, i) => (
                        <div key={i} className="flex flex-col items-center group relative z-10 w-24">
                            <div className="absolute -top-12 opacity-0 group-hover:opacity-100 transition-opacity bg-white text-black text-xs font-bold px-3 py-1 rounded mb-2">
                                1 : {d.val}
                            </div>
                            <div className="w-full bg-gray-900 rounded-t-lg relative flex items-end overflow-hidden h-96 border border-gray-800">
                                <div className={`w-full ${d.color} grow-height relative`} style={{'--target-height': d.h}}>
                                    {d.label === 'India' && <div className="absolute top-0 w-full h-1 bg-white animate-pulse shadow-[0_0_15px_white]"></div>}
                                </div>
                            </div>
                            <div className="mt-4 text-center">
                                <div className="text-sm font-bold text-white">{d.label}</div>
                                <div className="text-xs text-gray-500 mt-1">1 : {d.val}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 3. Risk Gauge
        const GaugeViz = () => (
            <div className="relative w-full h-full flex items-center justify-center">
                <svg viewBox="0 0 200 120" className="w-[120%] h-auto">
                    <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#1f2937" strokeWidth="20" strokeLinecap="round" />
                    <path d="M 20 100 A 80 80 0 0 1 60 44" fill="none" stroke="#10B981" strokeWidth="20" strokeDasharray="100" strokeDashoffset="100" className="animate-[dash_1s_ease-out_forwards]" style={{animationDelay: '0.5s'}} />
                    <path d="M 62 42 A 80 80 0 0 1 100 20" fill="none" stroke="#FBBF24" strokeWidth="20" strokeDasharray="100" strokeDashoffset="100" className="animate-[dash_1s_ease-out_forwards]" style={{animationDelay: '1s'}} />
                    <path d="M 102 20 A 80 80 0 0 1 180 100" fill="none" stroke="#DC2626" strokeWidth="20" strokeDasharray="200" strokeDashoffset="200" className="animate-[dash_1.5s_ease-out_forwards]" style={{animationDelay: '1.5s'}} />
                    <g className="origin-[100px_100px] animate-[rotateNeedle_2s_ease-out_forwards]" style={{transform: 'rotate(-90deg)'}}>
                         <polygon points="100,100 95,100 100,20 105,100" fill="white" />
                         <circle cx="100" cy="100" r="5" fill="white" />
                    </g>
                    <text x="100" y="80" textAnchor="middle" fill="#9CA3AF" fontSize="8" className="uppercase tracking-widest">Mismatch Risk</text>
                    <text x="100" y="65" textAnchor="middle" fill="#FFFFFF" fontSize="16" fontWeight="bold">CRITICAL</text>
                </svg>
                <style>{`@keyframes dash { to { stroke-dashoffset: 0; } } @keyframes rotateNeedle { to { transform: rotate(45deg); } }`}</style>
            </div>
        );

        // 4. System Flow Diagram
        const ProcessViz = () => (
             <div className="w-full h-full flex items-center justify-between px-4 relative">
                 <div className="absolute top-1/2 left-0 w-full h-0.5 bg-gray-800 -z-10"></div>
                 <div className="absolute top-1/2 left-0 h-0.5 bg-gradient-to-r from-transparent via-orange-500 to-transparent w-full animate-[flow_3s_linear_infinite] -z-10"></div>
                 {[{ title: "Discovery", sub: "Deep Profiling", icon: "🔍" }, { title: "Engine", sub: "Algorithmic Logic", icon: "⚙️" }, { title: "Roadmap", sub: "Execution Plan", icon: "🗺️" }].map((node, i) => (
                     <div key={i} className="relative group">
                         <div className="w-32 h-32 rounded-full border-2 border-gray-700 bg-[#0A0A0A] flex flex-col items-center justify-center relative z-10 transition-all duration-300 group-hover:border-orange-500 group-hover:scale-110 shadow-2xl">
                             <div className="text-3xl mb-2 filter grayscale group-hover:grayscale-0 transition-all">{node.icon}</div>
                             <div className="text-sm font-bold text-white">{node.title}</div>
                         </div>
                         <div className="absolute inset-0 rounded-full bg-orange-500/20 animate-ping opacity-0 group-hover:opacity-100" style={{animationDuration: '2s'}}></div>
                     </div>
                 ))}
                 <style>{`@keyframes flow { from { transform: translateX(-100%); } to { transform: translateX(100%); } }`}</style>
             </div>
        );

        // 5. Privacy Shield Viz
        const VizPrivacy = () => (
            <div className="w-full h-full flex items-center justify-center relative">
                {/* Rotating Shields */}
                <svg viewBox="0 0 200 200" className="w-[85%] h-auto absolute animate-[spin_20s_linear_infinite]">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#F97316" stopOpacity="0.8" />
                            <stop offset="100%" stopColor="#EA580C" stopOpacity="0.2" />
                        </linearGradient>
                    </defs>
                    <path id="shieldPath" d="M 100, 20 A 80,80 0 0,1 100,180 A 80,80 0 0,1 100,20" fill="none" stroke="url(#shieldGrad)" strokeWidth="1" strokeDasharray="10 5" />
                    {/* Orbiting Nodes */}
                    <circle r="4" fill="#fff">
                        <animateMotion dur="6s" repeatCount="indefinite">
                            <mpath href="#shieldPath"/>
                        </animateMotion>
                    </circle>
                    <circle r="4" fill="#F97316">
                        <animateMotion dur="6s" begin="2s" repeatCount="indefinite">
                            <mpath href="#shieldPath"/>
                        </animateMotion>
                    </circle>
                    <circle r="4" fill="#fff">
                        <animateMotion dur="6s" begin="4s" repeatCount="indefinite">
                            <mpath href="#shieldPath"/>
                        </animateMotion>
                    </circle>
                </svg>

                {/* Central Core */}
                <div className="z-10 bg-gray-900 border-2 border-orange-500 rounded-full w-40 h-40 flex flex-col items-center justify-center shadow-[0_0_30px_rgba(249,115,22,0.3)]">
                    <span className="text-4xl">🛡️</span>
                    <span className="text-xs font-bold text-white mt-2 uppercase tracking-widest text-center">Student<br/>First</span>
                </div>

                {/* Bouncing Threats */}
                <div className="absolute inset-0 pointer-events-none">
                    <div className="absolute top-[20%] right-[20%] flex items-center gap-2 animate-bounce" style={{animationDuration: '3s'}}>
                        <span className="text-gray-600 text-xs line-through decoration-red-500">Ads</span>
                        <span className="text-red-500 text-xl">✕</span>
                    </div>
                    <div className="absolute bottom-[25%] left-[20%] flex items-center gap-2 animate-bounce" style={{animationDuration: '4s'}}>
                        <span className="text-red-500 text-xl">✕</span>
                        <span className="text-gray-600 text-xs line-through decoration-red-500">Lead Sales</span>
                    </div>
                     <div className="absolute top-[25%] left-[25%] flex items-center gap-2 animate-bounce" style={{animationDuration: '3.5s'}}>
                        <span className="text-red-500 text-xl">✕</span>
                        <span className="text-gray-600 text-xs line-through decoration-red-500">Sponsors</span>
                    </div>
                </div>
            </div>
        );

        // 6. Student Volume Density (The "Who")
        const VizStudentVolume = () => {
            return (
                <div className="w-full h-full p-4 flex flex-col justify-center items-center">
                    <div className="w-full grid grid-cols-20 gap-1 opacity-80" style={{height: '300px'}}>
                        {Array.from({length: 400}).map((_, i) => {
                            const isHighlighted = i > 150 && i < 200; 
                            return (
                                <div 
                                    key={i} 
                                    className={`rounded-full scale-dot ${isHighlighted ? 'bg-orange-500 w-1.5 h-1.5 animate-pulse' : 'bg-gray-800 w-1 h-1'}`}
                                    style={{transitionDelay: `${i * 2}ms`}}
                                ></div>
                            )
                        })}
                    </div>
                    <div className="mt-6 flex justify-between w-full text-xs text-gray-500 uppercase tracking-widest">
                        <span>Total K-12: 260M+</span>
                        <span className="text-orange-500 font-bold">Annual Active Cohort: 15M+</span>
                    </div>
                </div>
            )
        }

        // 7. Market Size (TAM/SAM/SOM)
        const VizMarketSizing = () => {
            return (
                <div className="w-full h-full flex items-center justify-center relative">
                    <svg viewBox="0 0 200 200" className="w-[80%] h-auto">
                        {/* TAM - Stroke Only */}
                        <circle cx="100" cy="100" r="90" fill="none" stroke="#1f2937" strokeWidth="1" className="draw-circle" />
                        <text x="100" y="25" textAnchor="middle" fill="#4B5563" fontSize="6" className="uppercase font-bold">TAM ($10B+)</text>
                        
                        {/* SAM - Fill Fades In */}
                        <circle cx="100" cy="100" r="60" stroke="#6B7280" strokeWidth="1" className="draw-circle fade-fill" fill="rgba(31, 41, 55, 0.5)" style={{transitionDelay: '0.8s'}} />
                        <text x="100" y="55" textAnchor="middle" fill="#9CA3AF" fontSize="6" className="uppercase font-bold">SAM ($2.5B)</text>
                        
                        {/* SOM - Fill Fades In */}
                        <circle cx="100" cy="100" r="30" stroke="#F97316" strokeWidth="2" className="draw-circle fade-fill" fill="rgba(249, 115, 22, 0.2)" style={{transitionDelay: '1.2s'}} />
                        
                        <circle cx="100" cy="100" r="30" fill="transparent" className="animate-ping opacity-20">
                             <animate attributeName="r" from="0" to="30" dur="2s" repeatCount="indefinite" />
                        </circle>
                        <text x="100" y="102" textAnchor="middle" fill="#FFFFFF" fontSize="8" fontWeight="bold" className="uppercase">SOM</text>
                        <text x="100" y="110" textAnchor="middle" fill="#F97316" fontSize="6" className="uppercase">$150M</text>
                    </svg>
                </div>
            )
        }

        // --- Slide Components ---

        const SlideHero = ({ slide }) => (
            <div className="w-full h-full flex flex-col justify-center items-center text-center p-24 relative bg-black">
                 <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_rgba(20,20,30,1)_0%,_rgba(0,0,0,1)_80%)]"></div>
                 <div className="relative z-10 space-y-12">
                    <div className="animate-in delay-100 border border-orange-500/30 bg-orange-950/20 px-6 py-2 rounded-full inline-block backdrop-blur-md">
                        <span className="text-sm font-bold tracking-[0.3em] uppercase text-orange-500">Confidential Strategy Deck</span>
                    </div>
                    <h1 className="animate-in delay-200 text-[120px] font-bold tracking-tighter text-white leading-[0.9] drop-shadow-2xl">
                        {slide.title}
                    </h1>
                    <div className="animate-in delay-300 w-32 h-1 bg-gradient-to-r from-transparent via-orange-600 to-transparent mx-auto"></div>
                    <p className="animate-in delay-400 text-4xl text-gray-400 font-light max-w-4xl mx-auto leading-relaxed italic">
                        {slide.subtitle}
                    </p>
                 </div>
                 <div className="absolute bottom-12 animate-bounce text-gray-600">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                 </div>
            </div>
        );

        const SlideSection = ({ slide }) => (
            <div className="w-full h-full flex items-center p-32 bg-[#080808] relative overflow-hidden">
                <div className="absolute right-0 top-0 w-[50%] h-full bg-gradient-to-l from-[#111] to-transparent pointer-events-none"></div>
                <div className="relative z-10 max-w-5xl">
                    <div className="animate-in delay-100 flex items-center gap-6 mb-12">
                        <span className="text-8xl text-orange-600/20 font-bold font-sans">{slide.part}</span>
                        <div className="h-px w-full max-w-[200px] bg-gradient-to-r from-orange-600/50 to-transparent"></div>
                    </div>
                    <h2 className="animate-in delay-200 text-9xl font-bold text-white tracking-tighter mb-8 leading-none">
                        {slide.title}
                    </h2>
                    <p className="animate-in delay-300 text-4xl text-gray-400 font-light border-l-4 border-orange-600 pl-8 py-2">
                        {slide.subtitle}
                    </p>
                </div>
            </div>
        );

        const SlideDataLeft = ({ slide, index }) => {
            const Viz = slide.viz;
            return (
                <div className="w-full h-full flex bg-[#030303]">
                    <div className="w-[45%] h-full p-24 flex flex-col justify-center relative border-r border-white/5 bg-[#050505]">
                         <div className="animate-in delay-100 absolute top-24 left-24 flex items-center gap-3">
                             <div className="h-2 w-2 bg-orange-500 rounded-full"></div>
                             <span className="text-xs font-bold tracking-[0.2em] uppercase text-gray-500">Key Insight</span>
                         </div>
                         <div className="space-y-8">
                             <h3 className="animate-in delay-200 text-6xl font-bold text-white leading-[1.1] tracking-tight">
                                 {slide.title}
                             </h3>
                             <p className="animate-in delay-300 text-2xl text-gray-400 leading-relaxed font-light">
                                 {slide.body}
                             </p>
                         </div>
                         <div className="animate-in delay-400 mt-16 p-6 bg-white/5 rounded-lg border border-white/5">
                             <div className="text-xs text-gray-500 uppercase tracking-wider font-bold mb-2">Verified Source</div>
                             <div className="text-sm text-gray-300 font-mono">{slide.source}</div>
                         </div>
                    </div>
                    <div className="w-[55%] h-full p-24 flex flex-col justify-center items-center bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] relative">
                        <div className="absolute inset-0 bg-gradient-to-br from-black via-transparent to-black opacity-80"></div>
                        <div className="animate-in delay-300 w-full max-w-2xl bg-[#0F0F0F] border border-gray-800 rounded-3xl p-12 shadow-2xl relative z-10 group hover:border-orange-500/30 transition-colors duration-500">
                             <div className="h-[400px] w-full flex items-center justify-center relative">
                                 {Viz && <Viz />}
                             </div>
                             <div className="mt-8 pt-8 border-t border-gray-800 flex items-baseline justify-between">
                                 <div>
                                     <div className="text-sm text-gray-500 uppercase tracking-widest font-bold">Primary Metric</div>
                                     <div className="text-lg text-white mt-1">{slide.statLabel}</div>
                                 </div>
                                 <div className="text-7xl font-bold text-orange-500 tracking-tighter drop-shadow-lg">
                                     {slide.stat}
                                 </div>
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SlideClose = ({ slide }) => (
            <div className="w-full h-full flex flex-col justify-center items-center text-center p-24 bg-black relative overflow-hidden">
                 <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_#111_0%,_#000_100%)]"></div>
                 <div className="relative z-10 space-y-20">
                     <div className="space-y-4">
                        <h2 className="animate-in delay-100 text-[100px] font-bold text-gray-700 tracking-tighter leading-none">Strong Potential.</h2>
                        <h2 className="animate-in delay-200 text-[100px] font-bold text-white tracking-tighter leading-none relative inline-block">
                            Poorly Supported Decisions.
                            <div className="absolute bottom-4 left-0 w-full h-6 bg-orange-600/30 -skew-x-12"></div>
                        </h2>
                     </div>
                     <div className="animate-in delay-300">
                         <div className="inline-flex items-center gap-8 px-16 py-8 rounded-2xl border border-white/10 bg-white/5 backdrop-blur-2xl hover:bg-white/10 transition-colors cursor-pointer group">
                             <div className="h-6 w-6 rounded-full bg-orange-500 shadow-[0_0_20px_#F97316] group-hover:scale-125 transition-transform"></div>
                             <span className="text-4xl text-gray-300 font-light tracking-wide text-center">
                                 EDVOCATE helps improve the quality of <br/><strong className="text-white font-bold border-b-2 border-orange-500">academic and career decisions.</strong>
                             </span>
                         </div>
                     </div>
                     <div className="animate-in delay-400 opacity-40 hover:opacity-100 transition-opacity pt-20">
                         <img src={LOGO_URL} className="h-20 mx-auto brightness-0 invert" alt="EDVOCATE" />
                     </div>
                 </div>
            </div>
        );

        // --- Data ---
        const slides = [
            {
                type: "hero",
                title: "The Career Decision Gap",
                subtitle: "Introducing EDVOCATE: A Decision Support Engine",
                tagline: "CONFIDENTIAL"
            },
            {
                type: "section",
                part: "01",
                title: "The Context",
                subtitle: "Why academic and career decisions in India lack structured support."
            },
            {
                type: "data",
                title: "Premature Commitment",
                body: "Indian students are required to make early academic choices around age 15, often before adequate exploration is possible.",
                stat: "Age 15",
                statLabel: "Decision Lock-in",
                source: "Ministry of Education (AISHE)",
                viz: TimelineViz
            },
            {
                type: "data",
                title: "The Guidance Void",
                body: "With a student-to-counselor ratio of ~3000:1, professional guidance capacity is severely constrained in most Indian schools.",
                stat: "3000:1",
                statLabel: "Student Ratio",
                source: "IC3 Institute Report",
                viz: BenchmarkViz
            },
            {
                type: "data",
                title: "Systemic Mismatch",
                body: "The result is a high-risk decision environment, where a significant share of graduates report dissatisfaction with their chosen field of study.",
                stat: "45%",
                statLabel: "Regret Rate",
                source: "National Employability Report",
                viz: GaugeViz
            },
            {
                type: "section",
                part: "02",
                title: "The Solution",
                subtitle: "Improving decision quality through structured analysis."
            },
            {
                type: "data",
                title: "The Decision Engine",
                body: "EDVOCATE replaces ad-hoc guidance with structured analysis. A three-stage decision support process evaluates academic pathways against individual context.",
                stat: "3-Stage",
                statLabel: "Proprietary Algo",
                source: "Internal Framework",
                viz: ProcessViz
            },
            {
                type: "data",
                title: "The Trust Protocol",
                body: "We are a privacy-first education guidance platform. No lead sellers. No sponsored content. No Ads. The student is the customer, not the product.",
                stat: "100%",
                statLabel: "Data Integrity",
                source: "EDVOCATE Charter",
                viz: VizPrivacy
            },
            {
                type: "section",
                part: "03",
                title: "The Opportunity",
                subtitle: "Understanding scale and long-term demand."
            },
            {
                type: "data",
                title: "The Scale",
                body: "The 'Demographic Dividend' means unparalleled volume. Over 15 Million students enter the high-stakes decision zone annually.",
                stat: "15M+",
                statLabel: "Annual Cohort",
                source: "Census of India / Education Ministry",
                viz: VizStudentVolume
            },
            {
                type: "data",
                title: "Market Sizing",
                body: "Focusing on the paying urban/semi-urban segment (SAM) indicates a large serviceable opportunity within a broader education guidance market.",
                stat: "$2.5B",
                statLabel: "Serviceable Market",
                source: "EdTech Market Analysis 2025",
                viz: VizMarketSizing
            },
            {
                type: "close",
                brand: "EDVOCATE"
            }
        ];

        // --- Main App ---
        const App = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [scale, setScale] = useState(1);
            
            useEffect(() => {
                const handleResize = () => {
                    const windowW = window.innerWidth;
                    const windowH = window.innerHeight;
                    const scaleW = windowW / 1920;
                    const scaleH = windowH / 1080;
                    setScale(Math.min(scaleW, scaleH));
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
                        setCurrentIndex(prev => Math.min(prev + 1, slides.length - 1));
                    } else if (e.key === 'ArrowLeft') {
                        setCurrentIndex(prev => Math.max(prev - 1, 0));
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            const nextSlide = () => setCurrentIndex(prev => Math.min(prev + 1, slides.length - 1));

            return (
                <div className="w-full h-full flex items-center justify-center bg-[#111]" onClick={nextSlide}>
                    <div id="presentation-stage" style={{ transform: `scale(${scale})` }}>
                        <div className="noise"></div>
                        {slides.map((slide, index) => {
                            let Component;
                            if (slide.type === 'hero') Component = SlideHero;
                            else if (slide.type === 'section') Component = SlideSection;
                            else if (slide.type === 'data') Component = SlideDataLeft;
                            else if (slide.type === 'close') Component = SlideClose;

                            return (
                                <div key={index} className={`slide-container ${index === currentIndex ? 'active' : ''}`}>
                                    <Component slide={slide} index={index} />
                                </div>
                            );
                        })}
                        <div className="absolute bottom-8 right-12 z-50 text-gray-700 font-mono text-xl tracking-widest pointer-events-none">
                            {String(currentIndex + 1).padStart(2, '0')} / {String(slides.length).padStart(2, '0')}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
