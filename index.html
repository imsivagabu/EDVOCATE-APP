<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDVOCATE - The Decision Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Brand Palette */
            --paper-bg: #FFFFFF; 
            --ink-primary: #16233B; /* Deep Navy */
            --ink-secondary: #475569; /* Slate 600 */
            --brand-accent: #F47C20; /* Orange */
            --brand-accent-light: #FFF0E6; /* Light Orange Wash */
        }

        body { 
            font-family: 'Averia Serif Libre', serif; 
            background-color: var(--paper-bg); 
            color: var(--ink-primary); 
            margin: 0;
            overflow: hidden;
        }

        /* Paper Texture Overlay */
        .paper-texture {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .paper-card {
            background-color: #FFFFFF;
            border: 1px solid rgba(22, 35, 59, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                        5px 5px 0px rgba(244, 124, 32, 0.15);
            transition: transform 0.4s ease;
        }
        
        .paper-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 
                        7px 7px 0px rgba(244, 124, 32, 0.25);
        }

        .reveal-text {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-visible .reveal-text {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reveal-visible .delay-100 { transition-delay: 100ms; }
        .reveal-visible .delay-200 { transition-delay: 200ms; }
        .reveal-visible .delay-300 { transition-delay: 300ms; }

        .logo-img { height: 80px; width: auto; object-fit: contain; }
        
        /* Illustration Styles */
        .illustration-stroke { stroke: var(--ink-primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .illustration-fill { fill: var(--ink-primary); }
        .illustration-accent { stroke: var(--brand-accent); stroke-width: 2; }
        .illustration-accent-fill { fill: var(--brand-accent); }
        .illustration-wash { fill: var(--brand-accent-light); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const LOGO_URL = "https://raw.githubusercontent.com/imsivagabu/EDvocate-Logo/f41285224d83b110daddff1a18fbabf97dcbf6af/Logo%20Design.png";

        // --- Custom SVG Illustrations ---
        
        const IllusTimeline = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Timeline Line */}
                <line x1="20" y1="75" x2="180" y2="75" className="illustration-stroke" opacity="0.3"/>
                {/* School Phase */}
                <circle cx="40" cy="75" r="5" className="illustration-fill" opacity="0.3"/>
                <text x="40" y="95" textAnchor="middle" fontSize="10" fill="#94a3b8">Age 5</text>
                
                {/* The Cliff Edge (Age 15) */}
                <circle cx="100" cy="75" r="8" className="illustration-accent-fill" />
                <path d="M100 60 L100 40" className="illustration-accent" />
                <rect x="70" y="15" width="60" height="25" rx="4" className="illustration-accent-fill" opacity="0.1" />
                <text x="100" y="32" textAnchor="middle" fontSize="12" fontWeight="bold" fill="#F47C20">DECISION</text>
                <text x="100" y="95" textAnchor="middle" fontSize="12" fontWeight="bold" fill="#16233B">Age 15</text>
                
                {/* Future (Blurred/Unknown) */}
                <line x1="110" y1="75" x2="180" y2="75" className="illustration-stroke" strokeDasharray="4 4" />
                <text x="160" y="95" textAnchor="middle" fontSize="10" fill="#94a3b8">Future?</text>
            </svg>
        );

        const IllusEmptyChair = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Room */}
                <line x1="20" y1="130" x2="180" y2="130" className="illustration-stroke" />
                {/* The Empty Chair */}
                <path d="M90 130 L90 80 L70 80 L70 130" className="illustration-stroke" />
                <path d="M70 80 L110 80 L110 130" className="illustration-stroke" />
                <path d="M70 80 L70 50 L110 50 L110 80" className="illustration-stroke" strokeDasharray="4 4" opacity="0.5"/>
                
                {/* Question Mark */}
                <text x="90" y="70" textAnchor="middle" fontSize="40" fontWeight="bold" fill="#F47C20">?</text>
                <text x="90" y="145" textAnchor="middle" fontSize="12" fill="#16233B">No Counselor</text>
            </svg>
        );

        const IllusImbalance = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Sea of dots */}
                <g opacity="0.3" fill="#16233B">
                    {Array.from({length: 40}).map((_, i) => (
                        <circle key={i} cx={20 + (i%8)*22} cy={20 + Math.floor(i/8)*20} r="2" />
                    ))}
                </g>
                {/* The One Counselor */}
                <circle cx="100" cy="120" r="8" className="illustration-accent-fill" />
                <path d="M100 120 L100 80" className="illustration-accent" strokeDasharray="4 4"/>
                <text x="120" y="125" fontSize="12" fill="#F47C20" fontWeight="bold">1 Counselor</text>
            </svg>
        );

        const IllusWeight = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Fulcrum */}
                <path d="M100 130 L80 130 L90 110 Z" className="illustration-fill" />
                {/* Beam */}
                <line x1="20" y1="110" x2="180" y2="50" className="illustration-stroke" />
                
                {/* Light Side (Support) */}
                <circle cx="180" cy="40" r="10" className="illustration-stroke" strokeDasharray="2 2" />
                <text x="180" y="30" textAnchor="middle" fontSize="10" fill="#94a3b8">Support</text>

                {/* Heavy Side (Decision) */}
                <rect x="10" y="110" width="40" height="40" className="illustration-accent-fill" />
                <text x="30" y="135" textAnchor="middle" fontSize="20" fill="white" fontWeight="bold">!</text>
                <text x="30" y="100" textAnchor="middle" fontSize="12" fill="#16233B" fontWeight="bold">Pressure</text>
            </svg>
        );

        const IllusDiverge = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Path */}
                <path d="M20 75 L80 75" className="illustration-stroke" />
                {/* Wrong Path */}
                <path d="M80 75 Q120 75 160 30" className="illustration-stroke" stroke="#F47C20" strokeWidth="3" />
                <path d="M150 30 L160 30 L160 40" className="illustration-accent" fill="none" />
                {/* Correct Path (Faded) */}
                <path d="M80 75 Q120 75 160 120" className="illustration-stroke" opacity="0.2" strokeDasharray="4 4" />
                
                <text x="170" y="30" fontSize="12" fill="#F47C20" fontWeight="bold">Wrong Way</text>
            </svg>
        );

        const IllusRegret = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <circle cx="100" cy="75" r="40" className="illustration-stroke" strokeDasharray="4 4" opacity="0.3"/>
                {/* Clock Hands moving backwards */}
                <path d="M100 75 L100 45" className="illustration-accent" markerEnd="url(#arrow)" />
                <path d="M100 75 L70 75" className="illustration-stroke" />
                <path d="M130 75 A30 30 0 1 1 100 45" className="illustration-accent" fill="none" strokeDasharray="4 4" />
                <text x="100" y="135" textAnchor="middle" fontSize="12" fill="#16233B">"If I could go back..."</text>
            </svg>
        );

        const IllusBias = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <defs>
                    <filter id="blur" x="0" y="0"><feGaussianBlur in="SourceGraphic" stdDeviation="2" /></filter>
                </defs>
                {/* Blurry Data */}
                <rect x="40" y="40" width="120" height="80" rx="4" fill="#f1f5f9" />
                <path d="M50 60 L150 60 M50 80 L130 80 M50 100 L140 100" stroke="#cbd5e1" strokeWidth="4" />
                
                {/* The Influencer (Parent/Peer) */}
                <circle cx="160" cy="40" r="20" className="illustration-accent-fill" />
                <text x="160" y="45" textAnchor="middle" fontSize="24" fill="white" fontWeight="bold">"</text>
                <line x1="145" y1="50" x2="100" y2="80" className="illustration-accent" markerEnd="url(#arrow)" />
            </svg>
        );

        const IllusMoneyDrain = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Degree Scroll */}
                <path d="M60 40 L140 40 L140 100 L60 100 Z" className="illustration-wash" />
                <path d="M60 40 L140 40" className="illustration-stroke" />
                <text x="100" y="70" textAnchor="middle" fontSize="16" fill="#16233B" fontWeight="bold">DEGREE</text>
                
                {/* Leaking Coins */}
                <circle cx="80" cy="110" r="5" fill="#F47C20" />
                <circle cx="100" cy="125" r="5" fill="#F47C20" />
                <circle cx="120" cy="115" r="5" fill="#F47C20" />
                <path d="M100 100 L100 110" className="illustration-stroke" />
            </svg>
        );

        const IllusBrokenBridge = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Left Cliff (Education) */}
                <path d="M0 100 L60 100 L60 150 L0 150 Z" className="illustration-fill" opacity="0.1" />
                <text x="30" y="90" textAnchor="middle" fontSize="12" fill="#16233B" fontWeight="bold">Degree</text>
                
                {/* Right Cliff (Job) */}
                <path d="M140 100 L200 100 L200 150 L140 150 Z" className="illustration-fill" opacity="0.1" />
                <text x="170" y="90" textAnchor="middle" fontSize="12" fill="#F47C20" fontWeight="bold">Job</text>
                
                {/* Gap */}
                <path d="M60 100 L90 70" className="illustration-stroke" strokeDasharray="4 4" />
                <path d="M140 100 L110 70" className="illustration-stroke" strokeDasharray="4 4" />
                <text x="100" y="60" textAnchor="middle" fontSize="20" fill="#F47C20" fontWeight="bold">?</text>
            </svg>
        );

        const IllusCoaching = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Big Stack (Coaching) */}
                <rect x="40" y="40" width="60" height="90" className="illustration-wash" stroke="#F47C20" strokeWidth="2" />
                <text x="70" y="30" textAnchor="middle" fontSize="12" fill="#F47C20">Coaching</text>
                
                {/* Tiny Stack (Guidance) */}
                <rect x="120" y="110" width="40" height="20" className="illustration-stroke" />
                <text x="140" y="100" textAnchor="middle" fontSize="12" fill="#16233B">Guidance</text>
            </svg>
        );

        const IllusTracking = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Bar Chart */}
                <rect x="40" y="80" width="20" height="50" className="illustration-stroke" />
                <rect x="70" y="60" width="20" height="70" className="illustration-stroke" />
                <rect x="100" y="40" width="20" height="90" className="illustration-accent-fill" />
                
                {/* Cut off */}
                <line x1="130" y1="20" x2="130" y2="130" className="illustration-stroke" strokeDasharray="4 4" />
                <text x="160" y="75" textAnchor="middle" fontSize="12" fill="#94a3b8">No Data</text>
            </svg>
        );

        const IllusEngine = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                <rect x="40" y="40" width="120" height="80" rx="8" className="illustration-fill" fill="none" stroke="#16233B" strokeWidth="2" />
                {/* Gears */}
                <circle cx="80" cy="80" r="15" className="illustration-accent" fill="none" />
                <circle cx="120" cy="80" r="10" className="illustration-stroke" fill="none" />
                <path d="M40 80 L160 80" className="illustration-stroke" opacity="0.1" />
                <text x="100" y="140" textAnchor="middle" fontSize="12" fill="#16233B" fontWeight="bold">DECISION ENGINE</text>
            </svg>
        );

        const IllusFunnel = () => (
            <svg viewBox="0 0 200 150" className="w-full h-full">
                {/* Funnel Body */}
                <path d="M40 30 L160 30 L110 90 L110 130 L90 130 L90 90 Z" className="illustration-wash" stroke="#16233B" strokeWidth="2" />
                {/* Inputs */}
                <circle cx="60" cy="20" r="4" fill="#F47C20" />
                <circle cx="100" cy="15" r="4" fill="#16233B" />
                <circle cx="140" cy="20" r="4" fill="#F47C20" />
                {/* Output */}
                <path d="M100 130 L100 145" className="illustration-accent" markerEnd="url(#arrow)" />
            </svg>
        );

        // --- Data with Illustrations ---
        const slides = [
            {
                type: "hero",
                title: "India’s Career Decision Crisis",
                subtitle: "EDVOCATE is a Decision Engine",
                tagline: "No mixing. No dilution."
            },
            {
                id: 1,
                title: "The Core Problem",
                body: "India forces irreversible career decisions too early, without structured decision support.",
                stat: "15–16 Years Old",
                statText: "Students in India make their first irreversible career decision at age 15–16 (Class 10), earlier than most OECD countries.",
                source: "Ministry of Education / AISHE structural analysis",
                illustration: IllusTimeline
            },
            {
                id: 2,
                title: "Career Guidance Infrastructure (Missing)",
                body: "Career guidance is not institutionalized in India.",
                stat: "Zero (0)",
                statText: "India has no nationally mandated student-to-career-counsellor ratio in school or higher education policy.",
                source: "Parliamentary responses, Ministry of Education",
                illustration: IllusEmptyChair
            },
            {
                id: 3,
                title: "Career Counsellor Availability (Reality)",
                body: "Most students never meet a career counsellor.",
                stat: "75%",
                statText: "Over 75% of Indian schools do not have a dedicated career guidance professional.",
                source: "Education NGO audits & CBSE-affiliated school surveys",
                illustration: IllusImbalance
            },
            {
                id: 4,
                title: "Decision Load vs Support",
                body: "High-impact decisions, near-zero professional input.",
                stat: "10–15 Years",
                statText: "A single career decision in India typically determines 10–15 years of education + employment trajectory.",
                source: "Labour market & education pathway studies",
                illustration: IllusWeight
            },
            {
                id: 5,
                title: "Wrong Stream Selection (Direct Impact)",
                body: "Wrong decisions are widespread.",
                stat: "45%+",
                statText: "Indian students report they chose the wrong stream after Class 12.",
                source: "National student surveys & career platform studies",
                illustration: IllusDiverge
            },
            {
                id: 6,
                title: "Professional Regret (Long-Term Signal)",
                body: "Even adults confirm decision failure.",
                stat: "60–70%",
                statText: "Of Indian working professionals say they would choose a different career if starting again.",
                source: "Workforce attitude surveys",
                illustration: IllusRegret
            },
            {
                id: 7,
                title: "Why Wrong Decisions Happen",
                body: "Decisions are not data-driven.",
                stat: "70%",
                statText: "Of students say their career choice was driven by marks, parents, or peers — not aptitude.",
                source: "Career guidance research studies",
                illustration: IllusBias
            },
            {
                id: 8,
                title: "Economic Cost of Poor Decisions",
                body: "Wrong decisions have real financial consequences.",
                stat: "₹2–6 Lakh",
                statText: "Average middle-class Indian family spends ₹2–6 lakh on a degree before discovering mismatch.",
                source: "AISHE fee & household education expenditure data",
                illustration: IllusMoneyDrain
            },
            {
                id: 9,
                title: "Employability Mismatch",
                body: "Education → Job mapping is broken.",
                stat: "45%",
                statText: "Only ~45% of Indian graduates are considered employable for entry-level roles.",
                source: "Industry employability reports (NASSCOM / skill councils)",
                illustration: IllusBrokenBridge
            },
            {
                id: 10,
                title: "Why Coaching ≠ Career Guidance",
                body: "Preparation is mistaken for decision-making.",
                stat: "80%",
                statText: "Over 80% of paid education spend in Classes 9–12 goes to exam coaching, not career guidance.",
                source: "Indian test-prep market analysis",
                illustration: IllusCoaching
            },
            {
                id: 11,
                title: "The Missing Layer",
                body: "India optimizes for admission, not outcomes.",
                stat: "<10%",
                statText: "Fewer than 10% of institutions track student outcomes beyond degree completion.",
                source: "Higher-education quality audits",
                illustration: IllusTracking
            },
            {
                id: 12,
                title: "EDVOCATE’s Definition",
                body: "EDVOCATE is NOT counselling. It is a decision engine.",
                stat: "2–3×",
                statText: "Structured decision frameworks improve decision quality by 2–3× versus intuition-based choices.",
                source: "Decision science & behavioral economics research",
                illustration: IllusEngine
            },
            {
                id: 13,
                title: "EDVOCATE = Decision Engine",
                body: "What EDVOCATE Actually Does: Converts uncertainty → structured options. Maps student profile → career pathways → outcomes. Enables human-assisted, data-backed decisions. Acts before damage, not after.",
                stat: "30–40%",
                statText: "Early decision correction reduces later career switching by 30–40%.",
                source: "Career pathway longitudinal studies",
                illustration: IllusFunnel
            },
            {
                type: "close",
                quote: "“Great Talent.\nBroken Decisions.”",
                brand: "EDVOCATE builds the engine."
            }
        ];

        // --- Intersection Observer Hook ---
        const useIntersectionObserver = () => {
            const containerRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    setIsVisible(entry.isIntersecting);
                }, { threshold: 0.3 });

                if (containerRef.current) observer.observe(containerRef.current);
                return () => { if (containerRef.current) observer.unobserve(containerRef.current); };
            }, []);

            return [containerRef, isVisible];
        };

        const SlideRenderer = ({ slide, index, total }) => {
            const [ref, isVisible] = useIntersectionObserver();
            const Illustration = slide.illustration;
            
            // Layout for Hero
            if (slide.type === 'hero') {
                return (
                    <section ref={ref} className="h-screen w-full snap-start flex flex-col items-center justify-center p-8 relative">
                        <div className={`text-center space-y-10 max-w-4xl transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                            <div className="reveal-text delay-100 mb-8">
                                <img src={LOGO_URL} alt="EDVOCATE" className="logo-img h-32 mx-auto drop-shadow-lg" onError={(e) => e.target.style.display='none'} />
                                <h1 className="text-6xl font-bold text-[#F47C20] mt-4" style={{display: 'none'}}>EDVOCATE</h1> {/* Fallback */}
                            </div>
                            <div className="reveal-text delay-200">
                                <h2 className="text-5xl md:text-7xl font-bold text-[#16233B] leading-tight">
                                    {slide.title}
                                </h2>
                            </div>
                            <div className="reveal-text delay-300">
                                <p className="text-2xl md:text-3xl text-[#475569] font-normal italic border-t border-slate-300 pt-8 inline-block px-8">
                                    {slide.subtitle}
                                </p>
                            </div>
                            <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce text-[#F47C20]">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9" /></svg>
                            </div>
                        </div>
                    </section>
                );
            }

            // Layout for Close
            if (slide.type === 'close') {
                return (
                    <section ref={ref} className="h-screen w-full snap-start flex flex-col items-center justify-center p-8 bg-[#16233B] text-white">
                        <div className={`text-center space-y-12 max-w-5xl transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                            <div className="reveal-text delay-100">
                                <h2 className="text-5xl md:text-7xl font-bold leading-tight whitespace-pre-line">
                                    {slide.quote}
                                </h2>
                            </div>
                            <div className="w-24 h-1 bg-[#F47C20] mx-auto rounded-full reveal-text delay-200"></div>
                            <div className="reveal-text delay-300">
                                <p className="text-3xl font-bold tracking-wide uppercase opacity-90 text-[#F47C20]">
                                    {slide.brand}
                                </p>
                            </div>
                            <div className="mt-12 reveal-text delay-300">
                                <img src={LOGO_URL} alt="EDVOCATE" className="h-20 mx-auto brightness-0 invert" />
                            </div>
                        </div>
                    </section>
                );
            }

            // Standard Layout
            return (
                <section ref={ref} className="h-screen w-full snap-start flex items-center justify-center p-6 md:p-12">
                    <div className={`w-full max-w-6xl mx-auto transition-all duration-1000 ${isVisible ? 'reveal-visible' : ''}`}>
                        
                        <div className="grid md:grid-cols-2 gap-12 md:gap-20 items-center">
                            
                            {/* Left: Narrative */}
                            <div className="order-2 md:order-1 space-y-8">
                                <div className="reveal-text delay-100">
                                    <span className="text-[#F47C20] font-bold text-lg tracking-widest border-b-2 border-[#F47C20] pb-1">
                                        SLIDE {slide.id}
                                    </span>
                                </div>
                                <div className="reveal-text delay-200">
                                    <h3 className="text-4xl md:text-5xl font-bold text-[#16233B] leading-tight">
                                        {slide.title}
                                    </h3>
                                </div>
                                <div className="reveal-text delay-300">
                                    <p className="text-2xl text-[#475569] leading-relaxed">
                                        {slide.body}
                                    </p>
                                </div>
                            </div>

                            {/* Right: Data Card & Illustration */}
                            <div className="order-1 md:order-2 reveal-text delay-200">
                                <div className="paper-card p-8 md:p-10 rounded-lg relative overflow-hidden flex flex-col items-center">
                                    
                                    {/* SVG Illustration Container */}
                                    <div className="w-full h-40 mb-6 bg-slate-50/50 rounded-lg p-2 border border-slate-100">
                                        {Illustration && <Illustration />}
                                    </div>

                                    <div className="relative z-10 w-full text-center md:text-left">
                                        <div className="text-5xl md:text-6xl font-bold text-[#F47C20] mb-4 tracking-tight">
                                            {slide.stat}
                                        </div>
                                        <p className="text-lg md:text-xl text-[#16233B] font-normal leading-relaxed italic mb-6">
                                            {slide.statText}
                                        </p>
                                        <div className="pt-4 border-t border-slate-100">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">
                                                SOURCE
                                            </p>
                                            <p className="text-xs text-[#475569] mt-1 font-medium">
                                                {slide.source}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const containerRef = useRef(null);
            const [progress, setProgress] = useState(0);

            const handleScroll = () => {
                if(containerRef.current) {
                    const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
                    const scrolled = scrollTop / (scrollHeight - clientHeight);
                    setProgress(scrolled * 100);
                }
            };

            return (
                <div className="relative w-full h-screen bg-[#FFFFFF]">
                    {/* Background Texture */}
                    <div className="paper-texture"></div>

                    {/* Progress Bar */}
                    <div className="fixed top-0 left-0 w-full h-1.5 bg-slate-100 z-50">
                        <div 
                            className="h-full bg-[#F47C20] transition-all duration-200" 
                            style={{ width: `${progress}%` }}
                        ></div>
                    </div>

                    {/* Fixed Logo (Top Left) */}
                    <div className="fixed top-6 left-6 z-40 opacity-100">
                        <img src={LOGO_URL} alt="EDVOCATE" className="h-8 w-auto" />
                    </div>

                    {/* Main Scroll Area */}
                    <main 
                        ref={containerRef} 
                        onScroll={handleScroll}
                        className="h-full w-full overflow-y-scroll snap-y snap-mandatory scroll-smooth no-scrollbar relative z-10"
                    >
                        {slides.map((slide, index) => (
                            <SlideRenderer key={index} slide={slide} index={index} total={slides.length} />
                        ))}
                        
                        <div className="h-32 w-full snap-start flex items-center justify-center text-slate-400 text-sm">
                            © 2026 EDVOCATE - Confidential
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
